<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CWC Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  /* ═══ CWC Design Tokens — Light (default) ═══ */
  :root {
    /* Surfaces */
    --bg:                       #fafafa;
    --bg-nav:                   rgba(250,250,250,0.85);
    --bg-mobile-menu:           rgba(250,250,250,0.97);

    /* Text */
    --text:                     #09090b;
    --text-secondary:           #52525b;
    --text-muted:               #71717a;
    --text-dim:                 #a1a1aa;
    --text-faint:               #d4d4d8;

    /* Brand accents */
    --accent:                   #7c3aed;
    --accent-hover:             #6d28d9;
    --accent-secondary:         #0891b2;
    --gradient:                 linear-gradient(135deg, #7c3aed 0%, #0891b2 100%);

    /* Borders */
    --border:                   rgba(0,0,0,0.08);
    --border-light:             rgba(0,0,0,0.04);
    --border-lighter:           rgba(0,0,0,0.12);
    --border-accent:            rgba(124,58,237,0.2);
    --border-accent-strong:     rgba(124,58,237,0.3);

    /* Cards */
    --card-bg:                  rgba(0,0,0,0.02);
    --card-bg-hover:            rgba(0,0,0,0.04);
    --card-bg-accent:           rgba(124,58,237,0.04);
    --card-bg-accent-hover:     rgba(124,58,237,0.06);

    /* Status colors */
    --status-live-bg:           rgba(22,163,74,0.08);
    --status-live-text:         #16a34a;
    --status-live-border:       rgba(22,163,74,0.2);
    --status-idle-bg:           rgba(124,58,237,0.08);
    --status-idle-text:         #7c3aed;
    --status-idle-border:       rgba(124,58,237,0.2);

    /* Semantic */
    --color-pending:            #7c3aed;
    --color-progress:           #ca8a04;
    --color-done:               #16a34a;
    --color-fail:               #dc2626;
    --color-info:               #0891b2;

    /* Buttons */
    --btn-primary-bg:           #09090b;
    --btn-primary-text:         #fafafa;
    --btn-primary-hover:        #27272a;

    /* Misc */
    --shadow-sm:                0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:                0 4px 12px rgba(0,0,0,0.06);
  }

  /* ═══ Dark Mode ═══ */
  [data-theme="dark"] {
    --bg:                       #09090b;
    --bg-nav:                   rgba(9,9,11,0.85);
    --bg-mobile-menu:           rgba(9,9,11,0.97);

    --text:                     #fafafa;
    --text-secondary:           #a1a1aa;
    --text-muted:               #71717a;
    --text-dim:                 #52525b;
    --text-faint:               #3f3f46;

    --accent:                   #a78bfa;
    --accent-hover:             #c4b5fd;
    --accent-secondary:         #06b6d4;
    --gradient:                 linear-gradient(135deg, #a78bfa 0%, #06b6d4 100%);

    --border:                   rgba(255,255,255,0.06);
    --border-light:             rgba(255,255,255,0.04);
    --border-lighter:           rgba(255,255,255,0.08);
    --border-accent:            rgba(167,139,250,0.2);
    --border-accent-strong:     rgba(167,139,250,0.3);

    --card-bg:                  rgba(255,255,255,0.02);
    --card-bg-hover:            rgba(255,255,255,0.04);
    --card-bg-accent:           rgba(167,139,250,0.03);
    --card-bg-accent-hover:     rgba(167,139,250,0.04);

    --status-live-bg:           rgba(34,197,94,0.1);
    --status-live-text:         #22c55e;
    --status-live-border:       rgba(34,197,94,0.2);
    --status-idle-bg:           rgba(167,139,250,0.1);
    --status-idle-text:         #a78bfa;
    --status-idle-border:       rgba(167,139,250,0.2);

    --color-pending:            #a78bfa;
    --color-progress:           #eab308;
    --color-done:               #22c55e;
    --color-fail:               #f87171;
    --color-info:               #06b6d4;

    --btn-primary-bg:           #fafafa;
    --btn-primary-text:         #09090b;
    --btn-primary-hover:        #e4e4e7;

    --shadow-sm:                0 1px 2px rgba(0,0,0,0.2);
    --shadow-md:                0 4px 12px rgba(0,0,0,0.3);
  }

  /* ═══ Reset & Base ═══ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto;
  }

  body.modal-open {
    overflow: hidden;
  }

  #app {
    position: relative;
    min-height: 100vh;
  }

  /* ═══ Nav ═══ */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 1rem 2rem;
    background: var(--bg-nav);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .logo {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
  }
  .logo-mark {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: var(--gradient);
    vertical-align: middle;
    margin-right: 6px;
  }
  .logo-accent { color: var(--accent); }

  .status-badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-live {
    background: var(--status-live-bg);
    color: var(--status-live-text);
    border: 1px solid var(--status-live-border);
  }
  .status-idle {
    background: var(--status-idle-bg);
    color: var(--status-idle-text);
    border: 1px solid var(--status-idle-border);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--status-live-text);
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Theme toggle */
  .theme-toggle {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
    color: var(--text-secondary);
  }
  .theme-toggle:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
  }

  /* ═══ Tabs ═══ */
  .tabs {
    padding: 0 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tab .badge {
    font-size: 0.65rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-weight: 600;
  }

  /* ═══ Content ═══ */
  .content {
    padding: 1.5rem 2rem;
    max-width: 900px;
    margin: 0 auto;
  }

  /* ═══ Stats Bar ═══ */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    transition: border-color 0.3s, background 0.3s;
  }
  .stat-card:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
  }
  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .stat-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }
  .c-pending { color: var(--color-pending); }
  .c-progress { color: var(--color-progress); }
  .c-done { color: var(--color-done); }
  .c-fail { color: var(--color-fail); }
  .c-info { color: var(--color-info); }
  .c-accent { color: var(--accent); }

  /* ═══ Vertical Kanban ═══ */
  .v-kanban { display: flex; flex-direction: column; gap: 1.5rem; }

  .v-kanban-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .v-kanban-section.section-progress { border-left: 3px solid var(--color-progress); }
  .v-kanban-section.section-pending { border-left: 3px solid var(--color-pending); }
  .v-kanban-section.section-failed { border-left: 3px solid var(--color-fail); }
  .v-kanban-section.section-completed { border-left: 3px solid var(--color-done); opacity: 0.7; }
  .v-kanban-section.section-completed.collapsed .section-body { display: none; }

  .section-header {
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .section-header:hover { background: var(--card-bg-hover); }
  .section-header-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .section-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }
  .section-progress .section-icon { background: rgba(202,138,4,0.1); color: var(--color-progress); }
  .section-pending .section-icon { background: rgba(124,58,237,0.1); color: var(--color-pending); }
  .section-failed .section-icon { background: rgba(220,38,38,0.1); color: var(--color-fail); }
  .section-completed .section-icon { background: rgba(22,163,74,0.1); color: var(--color-done); }

  .section-count {
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .section-progress .section-count { background: rgba(202,138,4,0.08); color: var(--color-progress); }
  .section-pending .section-count { background: rgba(124,58,237,0.08); color: var(--color-pending); }
  .section-failed .section-count { background: rgba(220,38,38,0.08); color: var(--color-fail); }
  .section-completed .section-count { background: rgba(22,163,74,0.08); color: var(--color-done); }

  .collapse-chevron {
    font-size: 0.7rem;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .collapsed .collapse-chevron { transform: rotate(-90deg); }

  .section-body { padding: 0 0.5rem 0.5rem; }

  /* ═══ Issue Card ═══ */
  .issue-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    margin-bottom: 0.4rem;
    transition: all 0.2s ease;
    position: relative;
  }
  .issue-card:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
    box-shadow: var(--shadow-sm);
  }
  .issue-card.card-moving {
    animation: cardDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardDrop {
    0% { opacity: 0; transform: translateY(-12px) scale(0.97); }
    60% { opacity: 1; transform: translateY(2px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }
  .issue-card.card-sinking {
    animation: cardSink 0.4s ease forwards;
  }
  @keyframes cardSink {
    0% { opacity: 1; transform: translateY(0); }
    50% { opacity: 0.3; transform: translateY(8px); background: rgba(220,38,38,0.05); }
    100% { opacity: 0; transform: translateY(20px) scale(0.95); }
  }
  .issue-card.card-removed {
    animation: cardRemove 0.35s ease forwards;
  }
  @keyframes cardRemove {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.9) translateX(20px); height: 0; padding: 0; margin: 0; overflow: hidden; }
  }
  .issue-card.card-prioritized {
    animation: cardLift 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardLift {
    0% { opacity: 0; transform: translateY(12px) scale(0.97); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }

  .card-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
  .card-repo-link {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-weight: 500;
    text-decoration: none;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }
  .card-repo-link:hover { color: var(--accent); }
  .card-repo-link svg { width: 12px; height: 12px; }

  .card-time {
    font-size: 0.6rem;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .card-title-row {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .card-title-link {
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.35;
    font-weight: 500;
    flex: 1;
    transition: color 0.15s;
  }
  .card-title-link:hover { color: var(--accent); }

  .card-labels { display: flex; gap: 0.25rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .label-tag {
    font-size: 0.58rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--card-bg-accent);
    color: var(--accent);
    font-weight: 500;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
  }
  .card-author {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .card-author-avatar {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.5rem;
    color: white;
    font-weight: 700;
  }

  .card-actions {
    display: flex;
    gap: 0.3rem;
  }
  .card-action-btn {
    font-size: 0.6rem;
    padding: 0.2rem 0.5rem;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 0.2rem;
    white-space: nowrap;
  }
  .card-action-btn:hover {
    border-color: var(--border-accent);
    color: var(--accent);
    background: var(--card-bg-hover);
  }
  .card-action-btn:active {
    transform: scale(0.95);
  }
  .card-action-btn.btn-danger:hover {
    border-color: var(--color-fail);
    color: var(--color-fail);
    background: rgba(220,38,38,0.05);
  }
  .card-action-btn.btn-bottom:hover {
    border-color: var(--color-info);
    color: var(--color-info);
    background: rgba(8,145,178,0.05);
  }
  .card-action-btn.btn-top:hover {
    border-color: var(--color-progress);
    color: var(--color-progress);
    background: rgba(202,138,4,0.05);
  }

  .card-pr-info {
    font-size: 0.65rem;
    color: var(--color-done);
    font-weight: 500;
  }

  .empty-section {
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
    padding: 2rem 1rem;
  }

  /* ═══ Activity Timeline ═══ */
  .timeline { max-width: 900px; }
  .tl-item {
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.8rem;
    align-items: flex-start;
  }
  .tl-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .tl-icon.ev-enqueued { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.15); }
  .tl-icon.ev-claimed { background: rgba(202,138,4,0.08); border-color: rgba(202,138,4,0.15); }
  .tl-icon.ev-completed { background: rgba(22,163,74,0.08); border-color: rgba(22,163,74,0.15); }
  .tl-icon.ev-failed { background: rgba(220,38,38,0.08); border-color: rgba(220,38,38,0.15); }
  .tl-icon.ev-guard { background: var(--card-bg-accent); border-color: var(--border-accent); }
  .tl-content { flex: 1; min-width: 0; }
  .tl-title { color: var(--text); font-weight: 500; }
  .tl-title code {
    background: var(--card-bg);
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    font-size: 0.7rem;
    border: 1px solid var(--border);
  }
  .tl-detail { color: var(--text-muted); font-size: 0.7rem; margin-top: 0.15rem; }
  .tl-time { color: var(--text-dim); font-size: 0.7rem; white-space: nowrap; }

  /* ═══ Metrics ═══ */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .metric-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .metric-panel h3 {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-weight: 600;
  }
  .metric-big {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .metric-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.8rem;
  }
  .metric-row:last-child { border: none; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 80px;
    margin-top: 0.5rem;
  }
  .bar {
    flex: 1;
    min-width: 8px;
    border-radius: 3px 3px 0 0;
    background: var(--accent);
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .bar:hover { opacity: 1; }

  /* ═══ Guards ═══ */
  .guard-list { max-width: 900px; }
  .guard-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.2s;
  }
  .guard-item:hover { border-color: var(--border-accent); }
  .guard-type {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--card-bg-accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* ═══ Decompose Tree ═══ */
  .tree { max-width: 900px; }
  .tree-node {
    border-left: 2px solid var(--border);
    margin-left: 1rem;
    padding-left: 1rem;
    margin-bottom: 0.5rem;
  }
  .tree-root { margin-left: 0; border-left: none; padding-left: 0; }
  .tree-label { font-size: 0.85rem; padding: 0.4rem 0; font-weight: 500; }
  .tree-child { font-size: 0.8rem; color: var(--text-secondary); }

  /* ═══ Loading ═══ */
  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* ═══ Responsive ═══ */
  @media (max-width: 768px) {
    .metrics-grid { grid-template-columns: 1fr; }
    .header { padding: 0.875rem 1.5rem; }
    .tabs { padding: 0 1.5rem; }
    .content { padding: 1rem 1.5rem; }
  }
  @media (max-width: 480px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 0.75rem 1rem; }
    .tabs { padding: 0 1rem; }
    .content { padding: 0.75rem 1rem; }
  }

  /* Sync Button */
  .sync-btn {
    font-size: 0.75rem;
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border-accent);
    background: var(--card-bg-accent);
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .sync-btn:hover {
    background: var(--card-bg-accent-hover);
    border-color: var(--border-accent-strong);
  }
  .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sync-btn.syncing { animation: pulse 1s ease infinite; }

  /* Clickable cards */
  .issue-card.clickable { cursor: pointer; }
  .issue-card.clickable:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* Agent badge */
  .card-agent-badge {
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--card-bg-accent);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
  }

  /* Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 720px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
  }

  .modal-title-row { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
  .modal-title { font-size: 1.1rem; font-weight: 600; margin: 0; line-height: 1.4; }

  .modal-state {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .modal-state.open { background: #16a34a22; color: #4ade80; }
  .modal-state.closed { background: #ef444422; color: #f87171; }

  .modal-close {
    background: none; border: none; color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; padding: 0.25rem;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text); }

  .modal-copy-link {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 0.7rem; cursor: pointer; padding: 0.3rem 0.6rem;
    border-radius: 6px; flex-shrink: 0; white-space: nowrap;
  }
  .modal-copy-link:hover { color: var(--text); border-color: var(--border-accent); }

  .modal-meta {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .modal-repo { display: flex; align-items: center; gap: 0.35rem; }
  .modal-repo svg { opacity: 0.6; }
  .modal-labels { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .modal-gh-link { color: var(--accent); text-decoration: none; margin-left: auto; }
  .modal-gh-link:hover { text-decoration: underline; }

  .modal-body {
    padding: 1.25rem 1.5rem;
  }

  .modal-issue-body {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.85rem;
    line-height: 1.65;
    white-space: pre-wrap;
    word-break: break-word;
    color: var(--text);
  }

  .modal-empty { color: var(--text-muted); font-style: italic; font-size: 0.85rem; }

  .modal-comments { margin-top: 1.5rem; }
  .modal-comments h3 { font-size: 0.85rem; color: var(--text-muted); margin: 0 0 0.75rem 0; }
  .modal-comment {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1rem;
    margin-bottom: 0.5rem;
  }
  .comment-header { display: flex; justify-content: space-between; font-size: 0.75rem; color: var(--text-muted); margin-bottom: 0.5rem; }
  .comment-body { font-size: 0.8rem; line-height: 1.5; white-space: pre-wrap; word-break: break-word; }

  .modal-dispatch {
    padding: 1rem 1.5rem;
    border-top: 1px solid var(--border);
    background: rgba(167,139,250,0.06);
  }
  .modal-dispatch h3 { font-size: 0.85rem; margin: 0 0 0.75rem 0; }

  .dispatch-row { display: flex; gap: 0.5rem; align-items: center; }
  .dispatch-select {
    flex: 1;
    padding: 0.5rem 0.75rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text);
    font-size: 0.85rem;
  }
  .dispatch-btn {
    padding: 0.5rem 1.25rem;
    border-radius: 8px;
    border: none;
    background: var(--accent);
    color: #000;
    font-weight: 600;
    font-size: 0.85rem;
    cursor: pointer;
    transition: opacity 0.2s;
  }
  .dispatch-btn:hover { opacity: 0.85; }
  .dispatch-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .dispatch-desc { font-size: 0.7rem; color: var(--text-muted); margin: 0.5rem 0 0 0; }

  .agent-info { display: flex; gap: 1rem; font-size: 0.8rem; color: var(--text-muted); flex-wrap: wrap; margin-bottom: 0.75rem; }
  .agent-info span { background: var(--card-bg-hover); padding: 0.25rem 0.5rem; border-radius: 4px; }

  .agent-prs { margin-bottom: 0.75rem; }
  .agent-pr-link {
    display: inline-block;
    background: rgba(16,185,129,0.1);
    color: #6ee7b7;
    border: 1px solid rgba(16,185,129,0.2);
    padding: 0.3rem 0.6rem;
    border-radius: 6px;
    font-size: 0.8rem;
    text-decoration: none;
    margin-right: 0.5rem;
  }
  .agent-pr-link:hover { background: rgba(16,185,129,0.15); }

  .log-controls { margin-bottom: 0.5rem; }
  .log-autoscroll { font-size: 0.75rem; color: var(--text-muted); cursor: pointer; display: flex; align-items: center; gap: 0.35rem; }

  .agent-log {
    background: #000;
    color: #c9d1d9;
    font-family: 'SF Mono', 'Cascadia Code', 'Fira Code', 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    line-height: 1.55;
    padding: 0.75rem 1rem;
    border-radius: 8px;
    max-height: 350px;
    overflow-y: auto;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .log-line { white-space: pre-wrap; word-break: break-all; min-height: 1em; }
  .log-dim { color: #666; font-style: italic; }

  /* Repo Filter */
  .filter-bar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 1rem;
    flex-wrap: wrap;
    gap: 0.5rem;
  }
  .status-tabs {
    display: flex;
    gap: 0;
    border-radius: 8px;
    overflow: hidden;
    border: 1px solid var(--border);
  }
  .status-tab {
    font-size: 0.75rem;
    padding: 0.4rem 0.85rem;
    border: none;
    background: var(--bg);
    color: var(--text-muted);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .status-tab:not(:last-child) { border-right: 1px solid var(--border); }
  .status-tab:hover { color: var(--text); background: var(--card-bg); }
  .status-tab.active {
    background: var(--accent);
    color: #fff;
    font-weight: 600;
  }
  .filter-right {
    display: flex;
    align-items: center;
    gap: 0.5rem;
  }
  .filter-select {
    font-size: 0.8rem;
    padding: 0.4rem 0.6rem;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    appearance: auto;
  }
  .filter-select:hover { border-color: var(--border-accent); }

  /* Pagination */
  .pagination {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 1rem;
    padding: 0.75rem 0;
    border-top: 1px solid var(--border);
    margin: 0.5rem 0;
  }
  .page-btn {
    font-size: 0.75rem;
    padding: 0.35rem 0.75rem;
    border-radius: 6px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    cursor: pointer;
    font-family: inherit;
    transition: all 0.15s;
  }
  .page-btn:hover:not(:disabled) { background: var(--accent); color: #fff; border-color: var(--accent); }
  .page-btn:disabled { opacity: 0.4; cursor: default; }
  .page-info { font-size: 0.75rem; color: var(--text-muted); }
  .page-total { opacity: 0.7; }

  /* Toast */
  .toast-container {
    position: fixed;
    bottom: 1.5rem;
    right: 1.5rem;
    z-index: 1000;
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
  }
  .toast {
    padding: 0.6rem 1rem;
    border-radius: 8px;
    font-size: 0.75rem;
    font-weight: 500;
    background: var(--bg);
    border: 1px solid var(--border);
    box-shadow: var(--shadow-md);
    color: var(--text);
    animation: slideIn 0.2s ease;
  }
  .toast.success { border-color: var(--color-done); color: var(--color-done); }
  .toast.error { border-color: var(--color-fail); color: var(--color-fail); }
  @keyframes slideIn {
    from { opacity: 0; transform: translateY(0.5rem); }
    to { opacity: 1; transform: translateY(0); }
  }
</style>
</head>
<body>

<div id="app"></div>

<script type="module">
import { h, render, Component } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
import { createPortal } from 'https://esm.sh/preact@10.19.3/compat';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

const API = '';
const POLL_MS = 5000;

const TABS = [
  { id: 'kanban', label: 'Kanban', icon: '\u25A3' },
  { id: 'activity', label: 'Activity', icon: '\u26A1' },
  { id: 'metrics', label: 'Metrics', icon: '\u2587' },
  { id: 'guards', label: 'Guards', icon: '\u25C8' },
  { id: 'tree', label: 'Decompose', icon: '\u251C' },
];

const EVENT_ICONS = {
  'issue.enqueued': '\u2193', 'issue.claimed': '\u2192', 'issue.completed': '\u2713',
  'issue.failed': '\u2717', 'issue.retried': '\u21BB', 'issue.reset': '\u00D7',
  'webhook.received': '\u25C9', 'webhook.classified': '\u25B8',
  'decompose.enqueued': '\u25A3', 'decompose.child_created': '\u25AA',
  'decompose.completed': '\u2713', 'decompose.failed': '\u2717',
  'guard.triggered': '\u25C8', 'worker.dispatched': '\u25B8',
  'worker.completed': '\u2713', 'worker.failed': '\u26A0',
};

const EVENT_COLORS = {
  'issue.enqueued': 'ev-enqueued', 'issue.claimed': 'ev-claimed',
  'issue.completed': 'ev-completed', 'issue.failed': 'ev-failed',
  'guard.triggered': 'ev-guard',
};

function timeAgo(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts.replace('Z', ''));
    const s = Math.floor((Date.now() - d) / 1000);
    if (s < 0) return new Date(ts.replace('Z', '')).toLocaleDateString();
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  } catch { return ''; }
}

function shortRepo(repo) {
  return repo ? repo.split('/')[1] : '?';
}

function formatNum(n) {
  if (n === null || n === undefined) return '\u2014';
  return n.toLocaleString();
}

function authorInitial(author) {
  if (!author) return '?';
  return author.charAt(0).toUpperCase();
}

function githubIssueUrl(item) {
  if (item.html_url) return item.html_url;
  if (item.repo && item.issue_number) return `https://github.com/${item.repo}/issues/${item.issue_number}`;
  return '#';
}

// ─── Theme Toggle ───
function initTheme() {
  const stored = localStorage.getItem('mc-theme');
  if (stored === 'dark') {
    document.documentElement.setAttribute('data-theme', 'dark');
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}
initTheme();

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('mc-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('mc-theme', 'dark');
  }
}

// ─── API hooks ───
function useFetch(path, deps = []) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const r = await fetch(API + path);
      if (!r.ok) throw new Error(r.status);
      setData(await r.json());
      setError(null);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [path]);

  useEffect(() => { load(); const i = setInterval(load, POLL_MS); return () => clearInterval(i); }, [load]);
  return { data, loading, error, refresh: load };
}

// ─── Components ───

function Header({ queue }) {
  const ip = queue?.in_progress?.length || 0;
  const total = queue ? (queue.pending?.length || 0) + ip + (queue.completed?.length || 0) + (queue.failed?.length || 0) : 0;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return html`
    <div class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-mark"></span>
          Mission <span class="logo-accent">Control</span>
        </div>
        <span class="status-badge ${ip > 0 ? 'status-live' : 'status-idle'}">
          ${ip > 0 ? '\u25CF Processing' : '\u25CB Idle'}
        </span>
      </div>
      <div class="header-right">
        <div class="live-dot"></div>
        <span>Live \u00B7 ${total} tracked</span>
        <button class="theme-toggle" onClick=${toggleTheme} title="Toggle theme">
          ${isDark ? '\u2600' : '\u263D'}
        </button>
      </div>
    </div>
  `;
}

function TabBar({ active, onSwitch, counts }) {
  return html`
    <div class="tabs">
      ${TABS.map(t => html`
        <div class="tab ${active === t.id ? 'active' : ''}" onClick=${() => onSwitch(t.id)}>
          ${t.icon} ${t.label}
          ${counts[t.id] ? html`<span class="badge">${counts[t.id]}</span>` : null}
        </div>
      `)}
    </div>
  `;
}

function StatsBar({ queue, stats }) {
  const q = queue || {};
  return html`
    <div class="stats-bar">
      <div class="stat-card">
        <div class="stat-label">In Progress</div>
        <div class="stat-value c-progress">${formatNum(q.in_progress?.length)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Pending</div>
        <div class="stat-value c-pending">${formatNum(q.pending?.length)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Completed</div>
        <div class="stat-value c-done">${formatNum(q.completed?.length)}</div>
        <div class="stat-sub">all time</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Failed</div>
        <div class="stat-value c-fail">${formatNum(q.failed?.length)}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Avg Cycle</div>
        <div class="stat-value c-info">${stats?.avg_cycle_time_minutes ? stats.avg_cycle_time_minutes + 'm' : '\u2014'}</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Events 24h</div>
        <div class="stat-value c-accent">${formatNum(stats?.total_events_last_24h)}</div>
      </div>
    </div>
  `;
}

function IssueCard({ item, sectionKey, onPrioritize, onSendToBottom, onRemove, onRetry, animClass, onClick }) {
  const url = githubIssueUrl(item);
  const showActions = sectionKey === 'pending';
  const showRetry = sectionKey === 'failed';
  const showRerun = sectionKey === 'completed' || sectionKey === 'failed';

  return html`
    <div class="issue-card ${animClass || ''} clickable" key=${item.id} onClick=${() => onClick(item)}>
      <div class="card-top-row">
        <a class="card-repo-link" href=${url} target="_blank" rel="noopener noreferrer" onClick=${e => e.stopPropagation()}>
          <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0016 8c0-4.42-3.58-8-8-8z"/></svg>
          ${shortRepo(item.repo)}#${item.issue_number}
        </a>
        <span class="card-time">${timeAgo(item.enqueued_at)}</span>
      </div>

      <div class="card-title-row">
        <a class="card-title-link" href=${url} target="_blank" rel="noopener noreferrer" onClick=${e => e.stopPropagation()}>
          ${item.title || 'Untitled'}
        </a>
      </div>

      ${(item.labels && item.labels.length > 0) && html`
        <div class="card-labels">
          ${item.labels.slice(0, 4).map(l => html`<span class="label-tag">${l}</span>`)}
        </div>
      `}

      <div class="card-footer">
        <div class="card-author">
          <span class="card-author-avatar">${authorInitial(item.author)}</span>
          <span>${item.author || 'unknown'}</span>
        </div>

        ${sectionKey === 'completed' && item.pr_number && html`
          <span class="card-pr-info">PR #${item.pr_number}</span>
        `}

        ${sectionKey === 'in_progress' && item.agent_pid && html`
          <span class="card-agent-badge">\u{1F916} Agent running (PID ${item.agent_pid})</span>
        `}

        ${sectionKey === 'failed' && item.error && html`
          <span style="font-size:0.6rem;color:var(--color-fail);max-width:60%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${item.error}</span>
        `}

        <div class="card-actions" onClick=${e => e.stopPropagation()}>
          ${showActions && html`
            <button class="card-action-btn btn-top" onClick=${() => onPrioritize(item.id)} title="Move to top">\u2191 Top</button>
            <button class="card-action-btn btn-bottom" onClick=${() => onSendToBottom(item.id)} title="Send to bottom">\u2193 Bottom</button>
            <button class="card-action-btn btn-danger" onClick=${() => onRemove(item.id)} title="Remove">\u2717</button>
          `}
          ${showRetry && html`
            <button class="card-action-btn btn-top" onClick=${() => onRetry(item.id)} title="Retry">\u21BB Retry</button>
            <button class="card-action-btn btn-danger" onClick=${() => onRemove(item.id)} title="Remove">\u2717</button>
          `}
        </div>
      </div>
    </div>
  `;
}

function KanbanSection({ sectionKey, label, icon, items, collapsed, onToggleCollapse, onPrioritize, onSendToBottom, onRemove, onRetry, cardAnimClass, onCardClick }) {
  return html`
    <div class="v-kanban-section section-${sectionKey} ${collapsed ? 'collapsed' : ''}">
      <div class="section-header" onClick=${onToggleCollapse}>
        <div class="section-header-left">
          <span class="section-icon">${icon}</span>
          <span>${label}</span>
          <span class="section-count">${items.length}</span>
        </div>
        <span class="collapse-chevron">\u25BC</span>
      </div>
      <div class="section-body">
        ${items.length === 0 ?
          html`<div class="empty-section">No items</div>` :
          items.map(item => html`
            <${IssueCard}
              key=${item.id}
              item=${item}
              sectionKey=${sectionKey}
              onPrioritize=${onPrioritize}
              onSendToBottom=${onSendToBottom}
              onRemove=${onRemove}
              onRetry=${onRetry}
              animClass=${cardAnimClass}
              onClick=${onCardClick}
            />
          `)
        }
      </div>
    </div>
  `;
}

function VerticalKanban({ queue, statusFilter, completedPage, onPageChange, onPrioritize, onSendToBottom, onRemove, onRetry, onCardClick }) {
  const [collapsedSections, setCollapsedSections] = useState({ completed: false });

  if (!queue) return html`<div class="loading">Loading queue...</div>`;

  const toggleCollapse = (key) => {
    setCollapsedSections(prev => ({ ...prev, [key]: !prev[key] }));
  };

  // Determine which sections to show based on statusFilter
  let sections;
  if (statusFilter === 'active') {
    sections = [
      { key: 'in_progress', label: 'In Progress', icon: '\u2192' },
      { key: 'pending', label: 'Pending', icon: '\u25A3' },
    ];
  } else if (statusFilter === 'completed') {
    sections = [
      { key: 'completed', label: 'Completed', icon: '\u2713', paginated: true },
    ];
  } else if (statusFilter === 'failed') {
    sections = [
      { key: 'failed', label: 'Failed', icon: '\u2717' },
    ];
  } else {
    sections = [
      { key: 'in_progress', label: 'In Progress', icon: '\u2192' },
      { key: 'pending', label: 'Pending', icon: '\u25A3' },
      { key: 'failed', label: 'Failed', icon: '\u2717' },
      { key: 'completed', label: 'Completed', icon: '\u2713', paginated: true },
    ];
  }

  return html`
    <div class="v-kanban">
      ${sections.map(s => html`
        <${KanbanSection}
          key=${s.key}
          sectionKey=${s.key}
          label=${s.label}
          icon=${s.icon}
          items=${queue[s.key] || []}
          collapsed=${collapsedSections[s.key]}
          onToggleCollapse=${() => toggleCollapse(s.key)}
          onPrioritize=${onPrioritize}
          onSendToBottom=${onSendToBottom}
          onRemove=${onRemove}
          onRetry=${onRetry}
          onCardClick=${onCardClick}
        />
        ${s.paginated && queue._completedPages > 1 && html`
          <div class="pagination">
            <button
              class="page-btn"
              disabled=${completedPage === 0}
              onClick=${() => onPageChange(completedPage - 1)}
            >\u2190 Prev</button>
            <span class="page-info">${completedPage + 1} / ${queue._completedPages} <span class="page-total">(${queue._totalCompleted} items, last 7d)</span></span>
            <button
              class="page-btn"
              disabled=${completedPage >= queue._completedPages - 1}
              onClick=${() => onPageChange(completedPage + 1)}
            >Next \u2192</button>
          </div>
        `}
      `)}
    </div>
  `;
}

// Toast system
let _setToasts = null;
function showToast(msg, type = '') {
  if (_setToasts) {
    _setToasts(prev => [...prev, { msg, type, id: Date.now() }]);
    setTimeout(() => _setToasts(prev => prev.slice(1)), 3000);
  }
}

function AgentLogViewer({ item }) {
  const [agentStatus, setAgentStatus] = useState(null);
  const [logTail, setLogTail] = useState('');
  const [autoScroll, setAutoScroll] = useState(true);
  const logRef = useRef(null);

  const fetchStatus = useCallback(async () => {
    try {
      const r = await fetch(API + '/api/agent-status?item_id=' + encodeURIComponent(item.id));
      if (!r.ok) return;
      const d = await r.json();
      setAgentStatus(d);
      if (d.log_tail !== null) setLogTail(d.log_tail);
    } catch (e) {}
  }, [item.id]);

  useEffect(() => {
    fetchStatus();
    const interval = setInterval(fetchStatus, 3000);
    return () => clearInterval(interval);
  }, [fetchStatus]);

  useEffect(() => {
    if (autoScroll && logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [logTail, autoScroll]);

  const status = agentStatus?.status || 'loading';
  const isRunning = status === 'running';
  const linkedPRs = agentStatus?.linked_prs || [];

  return html`
    <h3 style="margin:0 0 0.75rem 0">
      ${isRunning ? '\u{1F916} Agent Running' : status === 'exited' ? '\u2705 Agent Finished' : '\u23F3 Loading...'}
      ${agentStatus?.pid && html`<span style="font-weight:normal;font-size:0.75rem;color:var(--text-muted);margin-left:0.5rem">PID ${agentStatus.pid}</span>`}
    </h3>

    <div class="agent-info">
      ${agentStatus?.started_at && html`<span>Started ${timeAgo(agentStatus.started_at)}</span>`}
      ${agentStatus?.prompt && html`<span>Prompt: ${agentStatus.prompt}</span>`}
    </div>

    ${linkedPRs.length > 0 && html`
      <div class="agent-prs">
        ${linkedPRs.map(pr => html`
          <a key=${pr.pr_number} href="https://github.com/${item.repo}/pull/${pr.pr_number}" target="_blank" rel="noopener noreferrer" class="agent-pr-link">
            PR #${pr.pr_number} ${pr.pr_title || ''}
          </a>
        `)}
      </div>
    `}

    <div class="log-controls">
      <label class="log-autoscroll">
        <input type="checkbox" checked=${autoScroll} onChange=${e => setAutoScroll(e.target.checked)} />
        Auto-scroll
      </label>
    </div>

    <div class="agent-log" ref=${logRef}>
      ${logTail
        ? logTail.split('\n').map((line, i) => html`<div key=${i} class="log-line">${line}</div>`)
        : html`<div class="log-line log-dim">Waiting for agent output...</div>`
      }
    </div>
  `;
}

function App() {
  const [tab, setTab] = useState('kanban');
  const [repoFilter, setRepoFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('active'); // active, completed, failed, all
  const [completedPage, setCompletedPage] = useState(0);
  const PAGE_SIZE = 20;
  const [syncing, setSyncing] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [animatingCards, setAnimatingCards] = useState({});
  const [selectedItem, setSelectedItem] = useState(null);
  const [issueDetail, setIssueDetail] = useState(null);
  const [issueLoading, setIssueLoading] = useState(false);
  const [dispatching, setDispatching] = useState(false);
  _setToasts = setToasts;

  const queue = useFetch('/api/queue');

  // Deep linking: open issue from URL hash (#issue=repo/owner#123)
  useEffect(() => {
    function handleHash() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const issueId = params.get('issue');
      if (issueId && !selectedItem) {
        // Find item in queue data
        const q = queue.data;
        if (!q) return;
        const all = [...(q.pending||[]), ...(q.in_progress||[]), ...(q.completed||[]), ...(q.failed||[])];
        const item = all.find(i => i.id === issueId);
        if (item) openIssueDetail(item);
      }
    }
    // Check on load and on hash change
    if (queue.data) handleHash();
    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);
  }, [queue.data]);
  const events = useFetch('/api/events?limit=50');
  const stats = useFetch('/api/stats');
  const tree = useFetch('/api/decompose-tree');
  const repos = useFetch('/api/repos');
  const prompts = useFetch('/api/prompts');

  const filteredQueue = (() => {
    if (!queue.data) return null;
    const base = repoFilter === 'all' ? queue.data : {
      pending: (queue.data?.pending || []).filter(i => i.repo === repoFilter),
      in_progress: (queue.data?.in_progress || []).filter(i => i.repo === repoFilter),
      completed: (queue.data?.completed || []).filter(i => i.repo === repoFilter),
      failed: (queue.data?.failed || []).filter(i => i.repo === repoFilter),
    };
    // Filter completed to last 7 days
    const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const recentCompleted = (base.completed || []).filter(i => {
      const ts = i.completed_at || i.started_at || i.enqueued_at;
      return ts && new Date(ts).getTime() > sevenDaysAgo;
    });
    // Paginate completed
    const totalCompleted = recentCompleted.length;
    const paginatedCompleted = recentCompleted.slice(completedPage * PAGE_SIZE, (completedPage + 1) * PAGE_SIZE);
    return {
      ...base,
      completed: paginatedCompleted,
      _totalCompleted: totalCompleted,
      _completedPage: completedPage,
      _completedPages: Math.ceil(totalCompleted / PAGE_SIZE),
    };
  })();

  const counts = {
    kanban: (filteredQueue?.pending?.length || 0) + (filteredQueue?.in_progress?.length || 0) + (filteredQueue?.failed?.length || 0),
    activity: events.data?.length || 0,
    guards: stats.data?.guard_triggers?.length || 0,
    tree: tree.data?.length || 0,
  };

  async function syncGitHub() {
    setSyncing(true);
    try {
      const params = repoFilter !== 'all' ? `?repo=${encodeURIComponent(repoFilter)}` : '';
      const r = await fetch(API + '/api/sync' + params);
      const d = await r.json();
      const t = d.totals || {};
      const parts = [];
      if (t.added) parts.push(`${t.added} added`);
      if (t.closed) parts.push(`${t.closed} closed`);
      if (t.unchanged) parts.push(`${t.unchanged} unchanged`);
      // Check for per-repo errors
      const errors = Object.entries(d.repos || {})
        .filter(([, v]) => v.errors?.length > 0)
        .map(([repo, v]) => `${repo.split('/')[1]}: ${v.errors[0]}`);
      const summary = parts.length > 0 ? parts.join(', ') : 'No changes';
      showToast(errors.length > 0
        ? `${summary} (${errors.length} error${errors.length > 1 ? 's' : ''})`
        : summary, errors.length > 0 ? 'warning' : 'success');
      queue.refresh();
    } catch (e) {
      showToast('Sync failed: ' + e.message, 'error');
    } finally {
      setSyncing(false);
    }
  }

  function animateCard(id, animClass) {
    setAnimatingCards(prev => ({ ...prev, [id]: animClass }));
    setTimeout(() => setAnimatingCards(prev => {
      const next = { ...prev };
      delete next[id];
      return next;
    }), 600);
  }

  async function prioritizeTop(itemId) {
    animateCard(itemId, 'card-prioritized');
    try {
      await fetch(API + '/api/queue/prioritize/' + encodeURIComponent(itemId), { method: 'PATCH' });
      showToast('Moved to top \u2191', 'success');
      queue.refresh();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function sendToBottom(itemId) {
    animateCard(itemId, 'card-sinking');
    // Small delay so user sees the animation before the card moves
    setTimeout(async () => {
      try {
        await fetch(API + '/api/queue/move-to-bottom/' + encodeURIComponent(itemId), { method: 'PATCH' });
        showToast('Sent to bottom \u2193', 'success');
        queue.refresh();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }, 350);
  }

  async function removeItem(itemId) {
    animateCard(itemId, 'card-removed');
    setTimeout(async () => {
      try {
        await fetch(API + '/api/queue/remove/' + encodeURIComponent(itemId), { method: 'PATCH' });
        showToast('Removed from queue', 'success');
        queue.refresh();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }, 350);
  }

  async function retryItem(itemId) {
    try {
      await fetch(API + '/api/queue/retry/' + encodeURIComponent(itemId), { method: 'PATCH' });
      showToast('Retrying...', 'success');
      queue.refresh();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  function closeModal() {
    setSelectedItem(null);
    setIssueDetail(null);
    window.location.hash = '';
  }

  async function openIssueDetail(item) {
    setSelectedItem(item);
    setIssueDetail(null);
    setIssueLoading(true);
    // Set URL hash for deep linking
    window.location.hash = `issue=${encodeURIComponent(item.id)}`;
    try {
      const r = await fetch(API + '/api/issue?repo=' + encodeURIComponent(item.repo) + '&number=' + item.issue_number);
      if (!r.ok) throw new Error(r.status);
      setIssueDetail(await r.json());
    } catch (e) {
      setIssueDetail({ error: e.message });
    } finally {
      setIssueLoading(false);
    }
  }

  async function dispatchAgent(itemId, promptId) {
    setDispatching(true);
    try {
      const r = await fetch(API + '/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: itemId, prompt_id: promptId }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      showToast(`Agent dispatched! PID ${d.pid}`, 'success');
      closeModal();
      queue.refresh();
    } catch (e) {
      showToast('Dispatch failed: ' + e.message, 'error');
    } finally {
      setDispatching(false);
    }
  }

  return html`
    <${Header} queue=${queue.data} />
    <${TabBar} active=${tab} onSwitch=${setTab} counts=${counts} />
    <div class="content">
      <${StatsBar} queue=${queue.data} stats=${stats.data} />
      ${tab === 'kanban' && html`
        <div class="filter-bar">
          <div class="status-tabs">
            ${[
              { key: 'active', label: 'Active' },
              { key: 'completed', label: 'Completed' },
              { key: 'failed', label: 'Failed' },
              { key: 'all', label: 'All' },
            ].map(st => html`
              <button key=${st.key}
                class="status-tab ${statusFilter === st.key ? 'active' : ''}"
                onClick=${() => { setStatusFilter(st.key); setCompletedPage(0); }}
              >${st.label}</button>
            `)}
          </div>
          <div class="filter-right">
            <select class="filter-select" value=${repoFilter} onChange=${e => setRepoFilter(e.target.value)}>
              <option value="all">All Repos</option>
              ${(repos.data || []).map(r => html`<option value=${r}>${r.split('/')[1]}</option>`)}
            </select>
            <button class="sync-btn ${syncing ? 'syncing' : ''}" onClick=${syncGitHub} disabled=${syncing}>
              ${syncing ? '\u21BB Syncing...' : '\u21BB Sync GitHub'}
            </button>
          </div>
        </div>
        <${VerticalKanban}
          queue=${filteredQueue}
          statusFilter=${statusFilter}
          completedPage=${completedPage}
          onPageChange=${setCompletedPage}
          onPrioritize=${prioritizeTop}
          onSendToBottom=${sendToBottom}
          onRemove=${removeItem}
          onRetry=${retryItem}
          onCardClick=${openIssueDetail}
        />
      `}
      ${tab === 'activity' && html`<${ActivityView} events=${events.data} />`}
      ${tab === 'metrics' && html`<${MetricsView} stats=${stats.data} />`}
      ${tab === 'guards' && html`<${GuardsView} stats=${stats.data} />`}
      ${tab === 'tree' && html`<${TreeView} data=${tree.data} />`}
    </div>
    ${selectedItem && html`
      <${IssueDetailModal}
        item=${selectedItem}
        issue=${issueDetail}
        prompts=${prompts.data}
        onClose=${closeModal}
        onDispatch=${dispatchAgent}
        dispatching=${dispatching}
      />
    `}
    <div class="toast-container">
      ${toasts.map(t => html`<div key=${t.id} class="toast ${t.type}">${t.msg}</div>`)}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
