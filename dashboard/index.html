<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CWC Mission Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* ═══ CWC Design Tokens — Light (default) ═══ */
  :root {
    --font-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
    /* Surfaces */
    --bg:                       #fafafa;
    --bg-nav:                   rgba(250,250,250,0.85);
    --bg-mobile-menu:           rgba(250,250,250,0.97);

    /* Text */
    --text:                     #09090b;
    --text-secondary:           #52525b;
    --text-muted:               #71717a;
    --text-dim:                 #a1a1aa;
    --text-faint:               #d4d4d8;

    /* Brand accents */
    --accent:                   #7c3aed;
    --accent-hover:             #6d28d9;
    --accent-secondary:         #0891b2;
    --gradient:                 linear-gradient(135deg, #7c3aed 0%, #0891b2 100%);

    /* Borders */
    --border:                   rgba(0,0,0,0.08);
    --border-light:             rgba(0,0,0,0.04);
    --border-lighter:           rgba(0,0,0,0.12);
    --border-accent:            rgba(124,58,237,0.2);
    --border-accent-strong:     rgba(124,58,237,0.3);

    /* Cards */
    --card-bg:                  rgba(0,0,0,0.02);
    --card-bg-hover:            rgba(0,0,0,0.04);
    --card-bg-accent:           rgba(124,58,237,0.04);
    --card-bg-accent-hover:     rgba(124,58,237,0.06);

    /* Status colors */
    --status-live-bg:           rgba(22,163,74,0.08);
    --status-live-text:         #16a34a;
    --status-live-border:       rgba(22,163,74,0.2);
    --status-idle-bg:           rgba(124,58,237,0.08);
    --status-idle-text:         #7c3aed;
    --status-idle-border:       rgba(124,58,237,0.2);

    /* Semantic */
    --color-pending:            #7c3aed;
    --color-progress:           #ca8a04;
    --color-done:               #16a34a;
    --color-fail:               #dc2626;
    --color-info:               #0891b2;

    /* Buttons */
    --btn-primary-bg:           #09090b;
    --btn-primary-text:         #fafafa;
    --btn-primary-hover:        #27272a;

    /* Misc */
    --shadow-sm:                0 1px 2px rgba(0,0,0,0.04);
    --shadow-md:                0 4px 12px rgba(0,0,0,0.06);
  }

  /* ═══ Dark Mode ═══ */
  [data-theme="dark"] {
    --bg:                       #09090b;
    --bg-nav:                   rgba(9,9,11,0.85);
    --bg-mobile-menu:           rgba(9,9,11,0.97);

    --text:                     #fafafa;
    --text-secondary:           #a1a1aa;
    --text-muted:               #71717a;
    --text-dim:                 #52525b;
    --text-faint:               #3f3f46;

    --accent:                   #a78bfa;
    --accent-hover:             #c4b5fd;
    --accent-secondary:         #06b6d4;
    --gradient:                 linear-gradient(135deg, #a78bfa 0%, #06b6d4 100%);

    --border:                   rgba(255,255,255,0.06);
    --border-light:             rgba(255,255,255,0.04);
    --border-lighter:           rgba(255,255,255,0.08);
    --border-accent:            rgba(167,139,250,0.2);
    --border-accent-strong:     rgba(167,139,250,0.3);

    --card-bg:                  rgba(255,255,255,0.02);
    --card-bg-hover:            rgba(255,255,255,0.04);
    --card-bg-accent:           rgba(167,139,250,0.03);
    --card-bg-accent-hover:     rgba(167,139,250,0.04);

    --status-live-bg:           rgba(34,197,94,0.1);
    --status-live-text:         #22c55e;
    --status-live-border:       rgba(34,197,94,0.2);
    --status-idle-bg:           rgba(167,139,250,0.1);
    --status-idle-text:         #a78bfa;
    --status-idle-border:       rgba(167,139,250,0.2);

    --color-pending:            #a78bfa;
    --color-progress:           #eab308;
    --color-done:               #22c55e;
    --color-fail:               #f87171;
    --color-info:               #06b6d4;

    --btn-primary-bg:           #fafafa;
    --btn-primary-text:         #09090b;
    --btn-primary-hover:        #e4e4e7;

    --shadow-sm:                0 1px 2px rgba(0,0,0,0.2);
    --shadow-md:                0 4px 12px rgba(0,0,0,0.3);
  }

  /* ═══ Reset & Base ═══ */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.5;
    -webkit-font-smoothing: antialiased;
    overflow-y: auto;
  }

  body.modal-open {
    overflow: hidden;
  }

  #app {
    position: relative;
    min-height: 100vh;
  }

  /* ═══ Nav ═══ */
  .header {
    position: sticky;
    top: 0;
    z-index: 100;
    padding: 1rem 2rem;
    background: var(--bg-nav);
    backdrop-filter: blur(12px);
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    justify-content: space-between;
  }
  .header-left { display: flex; align-items: center; gap: 1rem; }
  .logo {
    font-size: 1.1rem;
    font-weight: 600;
    letter-spacing: -0.02em;
    white-space: nowrap;
  }
  .logo-mark {
    display: inline-block;
    width: 20px;
    height: 20px;
    border-radius: 4px;
    background: var(--gradient);
    vertical-align: middle;
    margin-right: 6px;
  }
  .logo-accent { color: var(--accent); }

  .status-badge {
    font-size: 0.7rem;
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .status-live {
    background: var(--status-live-bg);
    color: var(--status-live-text);
    border: 1px solid var(--status-live-border);
  }
  .status-idle {
    background: var(--status-idle-bg);
    color: var(--status-idle-text);
    border: 1px solid var(--status-idle-border);
  }

  .header-right {
    display: flex;
    align-items: center;
    gap: 1rem;
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .live-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--status-live-text);
    animation: pulse 2s ease infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }

  /* Theme toggle */
  .theme-toggle {
    width: 32px;
    height: 32px;
    border-radius: 8px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1rem;
    transition: all 0.2s;
    color: var(--text-secondary);
  }
  .theme-toggle:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
  }

  /* ═══ Tabs ═══ */
  .tabs {
    padding: 0 2rem;
    border-bottom: 1px solid var(--border);
    display: flex;
    gap: 0;
    overflow-x: auto;
  }
  .tab {
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    font-weight: 500;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.15s;
    white-space: nowrap;
    display: flex;
    align-items: center;
    gap: 0.4rem;
  }
  .tab:hover { color: var(--text-secondary); }
  .tab.active {
    color: var(--text);
    border-bottom-color: var(--accent);
  }
  .tab .badge {
    font-size: 0.65rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--card-bg);
    color: var(--text-muted);
    border: 1px solid var(--border);
    font-weight: 600;
  }

  /* ═══ Content ═══ */
  .content {
    padding: 1.5rem 2rem;
    max-width: 1200px;
    margin: 0 auto;
  }

  /* ═══ Stats Bar ═══ */
  .stats-bar {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
    gap: 0.75rem;
    margin-bottom: 1.5rem;
  }
  .stat-card {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1rem;
    transition: border-color 0.3s, background 0.3s;
  }
  .stat-card:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
  }
  .stat-label {
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.15em;
    color: var(--text-muted);
    margin-bottom: 0.25rem;
  }
  .stat-value {
    font-size: 1.5rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .stat-sub {
    font-size: 0.65rem;
    color: var(--text-dim);
    margin-top: 0.15rem;
  }
  .c-pending { color: var(--color-pending); }
  .c-progress { color: var(--color-progress); }
  .c-done { color: var(--color-done); }
  .c-fail { color: var(--color-fail); }
  .c-info { color: var(--color-info); }
  .c-accent { color: var(--accent); }

  /* ═══ Vertical Kanban ═══ */
  .v-kanban { display: flex; flex-direction: column; gap: 1.5rem; }

  .v-kanban-section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    overflow: hidden;
  }
  .v-kanban-section.section-progress { border-left: 3px solid var(--color-progress); }
  .v-kanban-section.section-pending { border-left: 3px solid var(--color-pending); }
  .v-kanban-section.section-failed { border-left: 3px solid var(--color-fail); }
  .v-kanban-section.section-completed { border-left: 3px solid var(--color-done); opacity: 0.7; }
  .v-kanban-section.section-completed.collapsed .section-body { display: none; }

  .section-header {
    padding: 0.875rem 1rem;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: pointer;
    user-select: none;
  }
  .section-header:hover { background: var(--card-bg-hover); }
  .section-header-left {
    display: flex;
    align-items: center;
    gap: 0.5rem;
    font-size: 0.8rem;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .section-icon {
    width: 24px;
    height: 24px;
    border-radius: 6px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.75rem;
  }
  .section-progress .section-icon { background: rgba(202,138,4,0.1); color: var(--color-progress); }
  .section-pending .section-icon { background: rgba(124,58,237,0.1); color: var(--color-pending); }
  .section-failed .section-icon { background: rgba(220,38,38,0.1); color: var(--color-fail); }
  .section-completed .section-icon { background: rgba(22,163,74,0.1); color: var(--color-done); }

  .section-count {
    font-size: 0.65rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    font-weight: 600;
  }
  .section-progress .section-count { background: rgba(202,138,4,0.08); color: var(--color-progress); }
  .section-pending .section-count { background: rgba(124,58,237,0.08); color: var(--color-pending); }
  .section-failed .section-count { background: rgba(220,38,38,0.08); color: var(--color-fail); }
  .section-completed .section-count { background: rgba(22,163,74,0.08); color: var(--color-done); }

  .collapse-chevron {
    font-size: 0.7rem;
    color: var(--text-dim);
    transition: transform 0.2s;
  }
  .collapsed .collapse-chevron { transform: rotate(-90deg); }

  .section-body { padding: 0 0.5rem 0.5rem; }

  /* ═══ Issue Card ═══ */
  .issue-card {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.875rem 1rem;
    margin-bottom: 0.4rem;
    transition: all 0.2s ease;
    position: relative;
  }
  .issue-card:hover {
    border-color: var(--border-accent);
    background: var(--card-bg-hover);
    box-shadow: var(--shadow-sm);
  }
  .issue-card.card-moving {
    animation: cardDrop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardDrop {
    0% { opacity: 0; transform: translateY(-12px) scale(0.97); }
    60% { opacity: 1; transform: translateY(2px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }
  .issue-card.card-sinking {
    animation: cardSink 0.4s ease forwards;
  }
  @keyframes cardSink {
    0% { opacity: 1; transform: translateY(0); }
    50% { opacity: 0.3; transform: translateY(8px); background: rgba(220,38,38,0.05); }
    100% { opacity: 0; transform: translateY(20px) scale(0.95); }
  }
  .issue-card.card-removed {
    animation: cardRemove 0.35s ease forwards;
  }
  @keyframes cardRemove {
    0% { opacity: 1; transform: scale(1); }
    100% { opacity: 0; transform: scale(0.9) translateX(20px); height: 0; padding: 0; margin: 0; overflow: hidden; }
  }
  .issue-card.card-prioritized {
    animation: cardLift 0.5s cubic-bezier(0.34, 1.56, 0.64, 1);
  }
  @keyframes cardLift {
    0% { opacity: 0; transform: translateY(12px) scale(0.97); }
    60% { opacity: 1; transform: translateY(-2px) scale(1.01); }
    100% { transform: translateY(0) scale(1); }
  }

  .card-top-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 0.5rem;
    margin-bottom: 0.3rem;
  }
  .card-repo-link {
    font-size: 0.65rem;
    color: var(--text-dim);
    font-weight: 500;
    text-decoration: none;
    transition: color 0.15s;
    display: flex;
    align-items: center;
    gap: 0.25rem;
  }
  .card-repo-link:hover { color: var(--accent); }
  .card-repo-link svg { width: 12px; height: 12px; }

  .card-time {
    font-size: 0.6rem;
    color: var(--text-dim);
    white-space: nowrap;
  }

  .card-title-row {
    display: flex;
    align-items: flex-start;
    gap: 0.5rem;
  }
  .card-title-link {
    color: var(--text);
    text-decoration: none;
    font-size: 0.85rem;
    line-height: 1.35;
    font-weight: 500;
    flex: 1;
    transition: color 0.15s;
  }
  .card-title-link:hover { color: var(--accent); }

  .card-labels { display: flex; gap: 0.25rem; margin-top: 0.4rem; flex-wrap: wrap; }
  .label-tag {
    font-size: 0.58rem;
    padding: 0.1rem 0.4rem;
    border-radius: 999px;
    background: var(--card-bg-accent);
    color: var(--accent);
    font-weight: 500;
  }

  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-top: 0.5rem;
  }
  .card-author {
    display: flex;
    align-items: center;
    gap: 0.35rem;
    font-size: 0.7rem;
    color: var(--text-muted);
  }
  .card-author-avatar {
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: var(--gradient);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.5rem;
    color: white;
    font-weight: 700;
  }

  .card-actions {
    display: flex;
    gap: 0.3rem;
  }
  .card-action-btn {
    font-size: 0.6rem;
    padding: 0.2rem 0.5rem;
    border-radius: 5px;
    border: 1px solid var(--border);
    background: var(--card-bg);
    color: var(--text-muted);
    cursor: pointer;
    transition: all 0.15s;
    font-family: inherit;
    display: flex;
    align-items: center;
    gap: 0.2rem;
    white-space: nowrap;
  }
  .card-action-btn:hover {
    border-color: var(--border-accent);
    color: var(--accent);
    background: var(--card-bg-hover);
  }
  .card-action-btn:active {
    transform: scale(0.95);
  }
  .card-action-btn.btn-danger:hover {
    border-color: var(--color-fail);
    color: var(--color-fail);
    background: rgba(220,38,38,0.05);
  }
  .card-action-btn.btn-bottom:hover {
    border-color: var(--color-info);
    color: var(--color-info);
    background: rgba(8,145,178,0.05);
  }
  .card-action-btn.btn-top:hover {
    border-color: var(--color-progress);
    color: var(--color-progress);
    background: rgba(202,138,4,0.05);
  }

  .card-pr-info {
    font-size: 0.65rem;
    color: var(--color-done);
    font-weight: 500;
  }

  .empty-section {
    color: var(--text-dim);
    font-size: 0.8rem;
    text-align: center;
    padding: 2rem 1rem;
  }

  /* ═══ Activity Timeline ═══ */
  .timeline { max-width: 900px; }
  .tl-item {
    display: flex;
    gap: 0.75rem;
    padding: 0.75rem 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.8rem;
    align-items: flex-start;
  }
  .tl-icon {
    width: 28px;
    height: 28px;
    border-radius: 8px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.8rem;
    flex-shrink: 0;
    background: var(--card-bg);
    border: 1px solid var(--border);
  }
  .tl-icon.ev-enqueued { background: rgba(124,58,237,0.08); border-color: rgba(124,58,237,0.15); }
  .tl-icon.ev-claimed { background: rgba(202,138,4,0.08); border-color: rgba(202,138,4,0.15); }
  .tl-icon.ev-completed { background: rgba(22,163,74,0.08); border-color: rgba(22,163,74,0.15); }
  .tl-icon.ev-failed { background: rgba(220,38,38,0.08); border-color: rgba(220,38,38,0.15); }
  .tl-icon.ev-guard { background: var(--card-bg-accent); border-color: var(--border-accent); }
  .tl-content { flex: 1; min-width: 0; }
  .tl-title { color: var(--text); font-weight: 500; }
  .tl-title code {
    background: var(--card-bg);
    padding: 0.1rem 0.3rem;
    border-radius: 4px;
    font-size: 0.7rem;
    border: 1px solid var(--border);
  }
  .tl-detail { color: var(--text-muted); font-size: 0.7rem; margin-top: 0.15rem; }
  .tl-time { color: var(--text-dim); font-size: 0.7rem; white-space: nowrap; }

  /* ═══ Metrics ═══ */
  .metrics-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 1rem;
  }
  .metric-panel {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
  }
  .metric-panel h3 {
    font-size: 0.65rem;
    color: var(--text-muted);
    margin-bottom: 0.75rem;
    text-transform: uppercase;
    letter-spacing: 0.2em;
    font-weight: 600;
  }
  .metric-big {
    font-size: 2rem;
    font-weight: 700;
    letter-spacing: -0.03em;
  }
  .metric-row {
    display: flex;
    justify-content: space-between;
    padding: 0.4rem 0;
    border-bottom: 1px solid var(--border-light);
    font-size: 0.8rem;
  }
  .metric-row:last-child { border: none; }
  .bar-chart {
    display: flex;
    align-items: flex-end;
    gap: 3px;
    height: 80px;
    margin-top: 0.5rem;
  }
  .bar {
    flex: 1;
    min-width: 8px;
    border-radius: 3px 3px 0 0;
    background: var(--accent);
    opacity: 0.5;
    transition: opacity 0.15s;
  }
  .bar:hover { opacity: 1; }

  /* ═══ Guards ═══ */
  .guard-list { max-width: 900px; }
  .guard-item {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.875rem 1rem;
    margin-bottom: 0.5rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    transition: border-color 0.2s;
  }
  .guard-item:hover { border-color: var(--border-accent); }
  .guard-type {
    font-size: 0.7rem;
    padding: 0.15rem 0.5rem;
    border-radius: 999px;
    background: var(--card-bg-accent);
    color: var(--accent);
    font-weight: 600;
  }

  /* ═══ Decompose Tree ═══ */
  .tree { max-width: 900px; }
  .tree-node {
    border-left: 2px solid var(--border);
    margin-left: 1rem;
    padding-left: 1rem;
    margin-bottom: 0.5rem;
  }
  .tree-root { margin-left: 0; border-left: none; padding-left: 0; }
  .tree-label { font-size: 0.85rem; padding: 0.4rem 0; font-weight: 500; }
  .tree-child { font-size: 0.8rem; color: var(--text-secondary); }

  /* ═══ Loading ═══ */
  .loading {
    text-align: center;
    padding: 4rem 2rem;
    color: var(--text-dim);
    font-size: 0.85rem;
  }

  /* ═══ Portfolio Scorecard ═══ */
  .portfolio-view { animation: fadeSlideIn 0.25s ease both; }
  .portfolio-hero {
    position: relative;
    overflow: hidden;
    display: flex;

  .portfolio-chip.modelled,
  .portfolio-chip.finish,
  .portfolio-chip.fix { color: var(--color-progress); border-color: color-mix(in srgb, var(--color-progress) 35%, transparent); }
  .portfolio-chip.unverified,
  .portfolio-chip.escalate,
  .portfolio-chip.pause,
  .portfolio-chip.stale { color: var(--color-fail); border-color: color-mix(in srgb, var(--color-fail) 35%, transparent); }
  .project-score {
    min-width: 48px;

    font-weight: 700;

  .portfolio-detail-header {

    font-size: 0.62rem;

  }
  .portfolio-copy:hover { border-color: var(--border-accent-strong); transform: translateY(-1px); }
  .portfolio-empty { padding: 4rem 1rem; text-align: center; color: var(--text-muted); }
  .outcome-funnel { display: grid; grid-template-columns: repeat(7, minmax(110px, 1fr)); gap: 0.65rem; margin: 1.25rem 0; overflow-x: auto; }
  .outcome-stage { min-width: 110px; padding: 1rem; border: 1px solid var(--border); border-radius: 10px; background: var(--card-bg); }

  .outcome-reference { font-family: var(--font-mono); font-size: 0.67rem; color: var(--text-muted); overflow-wrap: anywhere; margin-top: 0.35rem; }

  @media (max-width: 900px) {
    .portfolio-grid { grid-template-columns: 1fr; }

    .portfolio-detail { order: 2; }
  }
  @media (max-width: 640px) {
    .portfolio-hero { padding: 1.4rem; display: block; }

    .portfolio-stats { grid-template-columns: 1fr 1fr; }
    .portfolio-decision { grid-template-columns: 1fr; }
    .dimension-row { grid-template-columns: 1fr 1.2fr 34px; }
    .wip-strip { align-items: flex-start; flex-direction: column; }
    .portfolio-detail-header { flex-direction: column; }

  /* ═══ Repository Context Audit ═══ */
  .context-audit-view { animation: fadeSlideIn 0.25s ease both; }
  .audit-hero {
    display: grid;
    grid-template-columns: minmax(0, 1.5fr) minmax(240px, 0.5fr);
    gap: 1rem;
    padding: 1.6rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border-accent);
    border-radius: 16px;
    background:
      radial-gradient(circle at 92% 12%, rgba(6,182,212,0.12), transparent 28%),
      var(--card-bg-accent);
    box-shadow: var(--shadow-md);
  }
  .audit-kicker {
    font-family: var(--font-mono);
    color: var(--accent);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.16em;
  }
  .audit-hero h1 {
    margin: 0.55rem 0 0.5rem;
    font-size: clamp(1.6rem, 4vw, 2.35rem);

    letter-spacing: -0.04em;
  }
  .audit-hero p { max-width: 700px; color: var(--text-secondary); font-size: 0.86rem; }
  .audit-source {
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 1rem;
    padding: 0.9rem;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--bg);
    font-family: var(--font-mono);
    font-size: 0.62rem;
    color: var(--text-muted);
  }
  .audit-source strong { display: block; margin-top: 0.2rem; color: var(--text); overflow-wrap: anywhere; }
  .audit-source a { color: var(--accent); text-decoration: none; }
  .audit-source a:hover { text-decoration: underline; }
  .audit-state {
    display: flex;
    justify-content: space-between;
    gap: 1rem;
    align-items: center;
    padding: 0.75rem 0.9rem;
    margin-bottom: 1rem;
    border: 1px solid var(--status-live-border);
    border-radius: 10px;
    background: var(--status-live-bg);
    color: var(--status-live-text);
    font-family: var(--font-mono);
    font-size: 0.65rem;
  }
  .audit-state.stale {
    border-color: rgba(248,113,113,0.35);
    background: rgba(248,113,113,0.08);
    color: var(--color-fail);
  }
  .audit-stats {
    display: grid;
    grid-template-columns: repeat(4, minmax(0, 1fr));
    gap: 0.75rem;
    margin-bottom: 1rem;
  }
  .audit-stat {
    padding: 1rem;
    border: 1px solid var(--border);
    border-radius: 12px;
    background: var(--card-bg);
  }
  .audit-stat strong { display: block; margin-top: 0.25rem; font-size: 1.65rem; letter-spacing: -0.04em; }
  .audit-stat small { color: var(--text-muted); font-size: 0.62rem; }
  .audit-filter-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    flex-wrap: wrap;
    padding: 0.8rem;
    margin-bottom: 1rem;
    border: 1px solid var(--border);
    border-radius: 11px;
    background: var(--card-bg);
  }
  .audit-filter-group { display: flex; align-items: center; gap: 0.45rem; flex-wrap: wrap; }
  .audit-filter-label {
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 0.6rem;
    text-transform: uppercase;
    letter-spacing: 0.09em;
  }
  .audit-filter {
    padding: 0.38rem 0.55rem;
    border: 1px solid var(--border);
    border-radius: 7px;
    background: var(--bg);
    color: var(--text);
    font: inherit;
    font-size: 0.72rem;
  }
  .audit-layout {
    display: grid;
    grid-template-columns: minmax(235px, 0.58fr) minmax(0, 1.42fr);
    gap: 1rem;
    align-items: start;
  }
  .audit-findings,
  .audit-repositories {
    border: 1px solid var(--border);
    border-radius: 14px;
    background: var(--card-bg);
    overflow: hidden;
  }
  .audit-panel-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    border-bottom: 1px solid var(--border);
  }
  .audit-panel-title {
    font-family: var(--font-mono);
    color: var(--text-muted);
    font-size: 0.62rem;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }
  .audit-count {
    padding: 0.12rem 0.42rem;
    border: 1px solid var(--border);
    border-radius: 999px;
    color: var(--text-muted);
    font-family: var(--font-mono);
    font-size: 0.58rem;

  .audit-finding { padding: 0.8rem 1rem; border-bottom: 1px solid var(--border-light); }
  .audit-finding:last-child { border-bottom: 0; }
  .audit-finding strong { display: block; font-size: 0.74rem; overflow-wrap: anywhere; }
  .audit-finding-meta { margin: 0.25rem 0 0.4rem; color: var(--color-fail); font-size: 0.65rem; }
  .audit-repo { padding: 1rem; border-bottom: 1px solid var(--border); }
  .audit-repo:last-child { border-bottom: 0; }
  .audit-repo-head {
    display: grid;
    grid-template-columns: minmax(0, 1fr) auto;
    align-items: start;
    gap: 1rem;
  }
  .audit-repo h2 { font-size: 0.9rem; overflow-wrap: anywhere; }
  .audit-revision { margin-top: 0.18rem; color: var(--text-muted); font-family: var(--font-mono); font-size: 0.58rem; }
  .audit-score { font-size: 1.6rem; font-weight: 700; line-height: 1; text-align: right; }
  .audit-score small { display: block; margin-top: 0.2rem; color: var(--text-muted); font-size: 0.58rem; font-weight: 400; }
  .audit-score .drop { color: var(--color-fail); }
  .audit-score .gain { color: var(--color-done); }

  .audit-subscore strong { display: block; margin-top: 0.18rem; font-family: var(--font-mono); font-size: 0.7rem; }
  .audit-evidence { display: flex; gap: 0.35rem; flex-wrap: wrap; }

    color: var(--accent);
    font-family: var(--font-mono);

    text-decoration: none;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;

  .audit-empty {
    padding: 4rem 1rem;
    border: 1px dashed var(--border);
    border-radius: 14px;
    text-align: center;
    color: var(--text-muted);

  @media (max-width: 900px) {
    .audit-layout, .audit-hero { grid-template-columns: 1fr; }
    .audit-stats { grid-template-columns: 1fr 1fr; }
    .audit-subscore-grid { grid-template-columns: repeat(4, minmax(60px, 1fr)); }
  }
  @media (max-width: 560px) {
    .audit-stats { grid-template-columns: 1fr 1fr; }
    .audit-subscore-grid { grid-template-columns: repeat(2, minmax(80px, 1fr)); }
    .audit-state { align-items: flex-start; flex-direction: column; }
  }

  /* ═══ Responsive ═══ */
  @media (max-width: 768px) {
    .metrics-grid { grid-template-columns: 1fr; }
    .header { padding: 0.875rem 1.5rem; }
    .tabs { padding: 0 1.5rem; }
    .content { padding: 1rem 1.5rem; }
  }
  @media (max-width: 480px) {
    .stats-bar { grid-template-columns: repeat(2, 1fr); }
    .header { padding: 0.75rem 1rem; }
    .tabs { padding: 0 1rem; }
    .content { padding: 0.75rem 1rem; }

  /* Sync Button */
  .sync-btn {
    font-size: 0.75rem;
    padding: 0.4rem 0.8rem;
    border-radius: 8px;
    border: 1px solid var(--border-accent);
    background: var(--card-bg-accent);
    color: var(--accent);
    cursor: pointer;
    font-weight: 600;
    transition: all 0.2s;
    display: inline-flex;
    align-items: center;
    gap: 0.35rem;
  }
  .sync-btn:hover {
    background: var(--card-bg-accent-hover);
    border-color: var(--border-accent-strong);
  }
  .sync-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .sync-btn.syncing { animation: pulse 1s ease infinite; }

  /* Clickable cards */
  .issue-card.clickable { cursor: pointer; }
  .issue-card.clickable:hover { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }

  /* Agent badge */
  .card-agent-badge {
    font-size: 0.65rem;
    color: var(--accent);
    background: var(--card-bg-accent);
    padding: 0.15rem 0.4rem;
    border-radius: 4px;
  }

  /* Modal Overlay */
  .modal-overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.6);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 1000;
    backdrop-filter: blur(2px);
  }

  .modal {
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    width: 90%;
    max-width: 720px;
    max-height: 85vh;
    overflow-y: auto;
    box-shadow: 0 20px 60px rgba(0,0,0,0.4);
  }

  .modal-header {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    padding: 1.25rem 1.5rem;
    border-bottom: 1px solid var(--border);
    gap: 1rem;
  }

  .modal-title-row { display: flex; align-items: center; gap: 0.75rem; flex: 1; min-width: 0; }
  .modal-title { font-size: 1.1rem; font-weight: 600; margin: 0; line-height: 1.4; }

  .modal-state {
    font-size: 0.6rem;
    font-weight: 700;
    text-transform: uppercase;
    padding: 0.2rem 0.5rem;
    border-radius: 4px;
    white-space: nowrap;
    flex-shrink: 0;
  }
  .modal-state.open { background: #16a34a22; color: #4ade80; }
  .modal-state.closed { background: #ef444422; color: #f87171; }

  .modal-close {
    background: none; border: none; color: var(--text-muted);
    font-size: 1.2rem; cursor: pointer; padding: 0.25rem;
    flex-shrink: 0;
  }
  .modal-close:hover { color: var(--text); }

  .modal-copy-link {
    background: none; border: 1px solid var(--border); color: var(--text-muted);
    font-size: 0.7rem; cursor: pointer; padding: 0.3rem 0.6rem;
    border-radius: 6px; flex-shrink: 0; white-space: nowrap;
  }
  .modal-copy-link:hover { color: var(--text); border-color: var(--border-accent); }

  .modal-meta {
    display: flex; align-items: center; gap: 0.75rem; flex-wrap: wrap;
    padding: 0.75rem 1.5rem;
    border-bottom: 1px solid var(--border);
    font-size: 0.8rem;
    color: var(--text-muted);
  }
  .modal-repo { display: flex; align-items: center; gap: 0.35rem; }
  .modal-repo svg { opacity: 0.6; }
  .modal-labels { display: flex; gap: 0.35rem; flex-wrap: wrap; }
  .modal-gh-link { color: var(--accent); text-decoration: none; margin-left: auto; }

  .modal-body {
    padding: 1.25rem 1.5rem;
  }

  .modal-issue-body {
    font-family: -apple-system, system-ui, sans-serif;
    font-size: 0.85rem;
    line-height: 1.65;

<body>

<div id="app"></div>

<script type="module">
import { h, render, Component } from 'https://esm.sh/preact@10.19.3';
import { useState, useEffect, useCallback, useRef } from 'https://esm.sh/preact@10.19.3/hooks';
import { createPortal } from 'https://esm.sh/preact@10.19.3/compat';
import htm from 'https://esm.sh/htm@3.1.1';

const html = htm.bind(h);

// Use an explicit credential-free origin. Relative fetches fail in Chromium when
// the dashboard was opened as https://user:pass@host because Request() refuses
// to inherit credential-bearing URLs.
const API = window.location.origin;
const POLL_MS = 5000;

const TABS = [
  { id: 'portfolio', label: 'Portfolio', icon: '\u25C8' },
  { id: 'outcomes', label: 'Outcomes', icon: '\u25C9' },
  { id: 'context-audit', label: 'Context audit', icon: '\u25CE' },
  { id: 'kanban', label: 'Kanban', icon: '\u25A3' },
  { id: 'agents', label: 'Live Agents', icon: '\u25B6' },
  { id: 'activity', label: 'Activity', icon: '\u26A1' },
  { id: 'metrics', label: 'Metrics', icon: '\u2587' },
  { id: 'guards', label: 'Guards', icon: '\u25C8' },
  { id: 'tree', label: 'Decompose', icon: '\u251C' },
];

const EVENT_ICONS = {
  'issue.enqueued': '\u2193', 'issue.claimed': '\u2192', 'issue.completed': '\u2713',
  'issue.failed': '\u2717', 'issue.retried': '\u21BB', 'issue.reset': '\u00D7',
  'issue.requeued': '\u21BA',
  'webhook.received': '\u25C9', 'webhook.classified': '\u25B8',
  'decompose.enqueued': '\u25A3', 'decompose.child_created': '\u25AA',
  'decompose.completed': '\u2713', 'decompose.failed': '\u2717',
  'guard.triggered': '\u25C8', 'worker.dispatched': '\u25B8',
  'worker.completed': '\u2713', 'worker.failed': '\u26A0',
};

const EVENT_COLORS = {
  'issue.enqueued': 'ev-enqueued', 'issue.claimed': 'ev-claimed',
  'issue.completed': 'ev-completed', 'issue.failed': 'ev-failed',
  'guard.triggered': 'ev-guard',
};

function timeAgo(ts) {
  if (!ts) return '';
  try {
    const d = new Date(ts.replace('Z', ''));
    const s = Math.floor((Date.now() - d) / 1000);
    if (s < 0) return new Date(ts.replace('Z', '')).toLocaleDateString();
    if (s < 60) return s + 's ago';
    if (s < 3600) return Math.floor(s/60) + 'm ago';
    if (s < 86400) return Math.floor(s/3600) + 'h ago';
    return Math.floor(s/86400) + 'd ago';
  } catch { return ''; }
}

function shortRepo(repo) {
  return repo ? repo.split('/')[1] : '?';
}

function formatNum(n) {
  if (n === null || n === undefined) return '\u2014';
  return n.toLocaleString();
}

function authorInitial(author) {
  if (!author) return '?';
  return author.charAt(0).toUpperCase();
}

function githubIssueUrl(item) {
  if (item.html_url) return item.html_url;
  if (item.repo && item.issue_number) return `https://github.com/${item.repo}/issues/${item.issue_number}`;
  return '#';
}

function compactPath(path) {
  if (!path) return '';
  const parts = String(path).split('/');
  return parts.length > 4 ? '.../' + parts.slice(-4).join('/') : path;
}

function formatBytes(bytes) {
  if (!bytes) return '0 B';
  if (bytes < 1024) return bytes + ' B';
  if (bytes < 1024 * 1024) return (bytes / 1024).toFixed(1) + ' KB';
  return (bytes / (1024 * 1024)).toFixed(1) + ' MB';
}

async function apiJson(path) {
  const r = await fetch(API + path);
  let data = null;
  try { data = await r.json(); } catch {}
  if (!r.ok) {
    const msg = data?.error || data?.message || r.status;
    throw new Error(String(msg));
  }
  return data;
}

function parseDetails(details) {
  if (!details) return {};
  if (typeof details === 'object') return details;
  try { return JSON.parse(details); } catch { return { raw: String(details) }; }
}

function displayTime(ts) {
  if (!ts) return '-';
  const ago = timeAgo(ts);
  return ago ? `${ago} · ${String(ts).replace('T', ' ').replace(/\.\d+/, '')}` : String(ts);
}

function missingTelemetryFor(worker, status, trace) {
  const missing = new Set([...(worker?.telemetry_missing || []), ...(status?.telemetry_missing || [])]);
  if (!(worker?.pid || worker?.item_pid || status?.pid || trace?.pid)) missing.add('pid');
  if (!(worker?.session_id || status?.session_id || trace?.session_id)) missing.add('session_id');
  if (!(worker?.dispatch_id || status?.dispatch_id || trace?.dispatch_id)) missing.add('dispatch_id');
  return Array.from(missing).filter(Boolean);
}

function traceReliability(worker, statusData, traceData, errors = []) {
  if (errors.length) return { level: 'red', label: 'Error', reason: errors.join(', ') };
  const trace = traceData?.trace;
  const missing = missingTelemetryFor(worker, statusData, trace);
  if (statusData?.status === 'exited' && statusData?.liveness_reliable === false) {
    return { level: 'amber', label: 'Unverified', reason: 'PID/liveness telemetry is unreliable' };
  }
  if (missing.length || !traceData?.has_trace || !traceData?.has_bundle || statusData?.log_fallback) {
    const bits = [];
    if (missing.length) bits.push(`missing ${missing.join(', ')}`);
    if (!traceData?.has_trace) bits.push('no trace row');
    if (!traceData?.has_bundle) bits.push('no bundle');
    if (statusData?.log_fallback) bits.push('fallback log');
    return { level: 'amber', label: 'Partial', reason: bits.join(' · ') };
  }
  return { level: 'green', label: 'Reliable', reason: 'Trace row, bundle, and dispatch telemetry are present' };
}

function queueIndex(queue) {
  const map = {};
  ['pending', 'in_progress', 'completed', 'failed'].forEach(k => {
    (queue?.[k] || []).forEach(item => { map[item.id] = { ...item, queue_status: k }; });
  });
  return map;
}

// ─── Theme Toggle ───
function initTheme() {
  const stored = localStorage.getItem('mc-theme');
  if (stored === 'light') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
  }
}
initTheme();

function toggleTheme() {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    localStorage.setItem('mc-theme', 'light');
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    localStorage.setItem('mc-theme', 'dark');
  }
}

// ─── API hooks ───
function useFetch(path, deps = []) {
  const [data, setData] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  const load = useCallback(async () => {
    try {
      const r = await fetch(API + path);
      if (!r.ok) throw new Error(r.status);
      setData(await r.json());
      setError(null);
    } catch (e) {
      setError(e.message);
    } finally {
      setLoading(false);
    }
  }, [path]);

  useEffect(() => { load(); const i = setInterval(load, POLL_MS); return () => clearInterval(i); }, [load]);
  return { data, loading, error, refresh: load };
}

// ─── Components ───

function Header({ queue }) {
  const ip = queue?.in_progress?.length || 0;
  const total = queue ? (queue.pending?.length || 0) + ip + (queue.completed?.length || 0) + (queue.failed?.length || 0) : 0;
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  return html`
    <div class="header">
      <div class="header-left">
        <div class="logo">
          <span class="logo-mark"></span>
          Mission <span class="logo-accent">Control</span>
        </div>
        <span class="status-badge ${ip > 0 ? 'status-live' : 'status-idle'}">
          ${ip > 0 ? '\u25CF Processing' : '\u25CB Idle'}
        </span>
      </div>
      <div class="header-right">
        <div class="live-dot"></div>
        <span>Live \u00B7 ${total} tracked</span>
        <button class="theme-toggle" onClick=${toggleTheme} title="Toggle theme">
          ${isDark ? '\u2600' : '\u263D'}
        </button>
      </div>
    </div>
  `;
}

function TabBar({ active, onSwitch, counts }) {
  return html`
    <div class="tabs">
      ${TABS.map(t => html`
        <div class="tab ${active === t.id ? 'active' : ''}" onClick=${() => onSwitch(t.id)}>
          ${t.icon} ${t.label}
          ${counts[t.id] ? html`<span class="badge">${counts[t.id]}</span>` : null}
        </div>
      `)}
    </div>
  `;
}

function RepoEligibilityAlerts({ diagnostics, repoFilter }) {
  const alerts = (diagnostics?.alerts || []).filter(a => repoFilter === 'all' || a.repo === repoFilter);
  const summaries = (diagnostics?.repos || []).filter(r => repoFilter === 'all' || r.repo === repoFilter);
  const notable = summaries.filter(r => r.visible > 0 && (r.eligible === 0 || r.blocked > 0)).slice(0, 4);
  if (!alerts.length && !notable.length) return null;
  return html`
    <div style="margin-bottom:1rem;display:flex;flex-direction:column;gap:0.5rem">
      ${alerts.map(a => html`
        <div style=${`border:1px solid ${a.severity === 'red' ? 'rgba(220,38,38,0.35)' : 'rgba(202,138,4,0.35)'};background:${a.severity === 'red' ? 'rgba(220,38,38,0.06)' : 'rgba(202,138,4,0.06)'};border-radius:12px;padding:0.75rem 1rem;font-size:0.8rem;color:var(--text)`}>
          <strong>${shortRepo(a.repo)}</strong>: ${a.message}

function VerticalKanban({ queue, statusFilter, completedPage, onPageChange, onPrioritize, onSendToBottom, onRemove, onRetry, onRecover, onCardClick }) {
  const [collapsedSections, setCollapsedSections] = useState({ completed: false });

  if (!queue) return html`<div class="loading">Loading queue...</div>`;

  const toggleCollapse = (key) => {
    setCollapsedSections(prev => ({ ...prev, [key]: !prev[key] }));
  };

  // Determine which sections to show based on statusFilter
  let sections;
  if (statusFilter === 'active') {
    sections = [
      { key: 'in_progress', label: 'In Progress', icon: '\u2192' },
      { key: 'pending', label: 'Pending', icon: '\u25A3' },
    ];
  } else if (statusFilter === 'completed') {
    sections = [
      { key: 'completed', label: 'Completed', icon: '\u2713', paginated: true },
    ];
  } else if (statusFilter === 'failed') {
    sections = [
      { key: 'failed', label: 'Failed', icon: '\u2717' },
    ];
  } else {
    sections = [
      { key: 'in_progress', label: 'In Progress', icon: '\u2192' },
      { key: 'pending', label: 'Pending', icon: '\u25A3' },
      { key: 'failed', label: 'Failed', icon: '\u2717' },
      { key: 'completed', label: 'Completed', icon: '\u2713', paginated: true },
    ];
  }

  return html`
    <div class="v-kanban">
      ${sections.map(s => html`
        <${KanbanSection}
          key=${s.key}
          sectionKey=${s.key}
          label=${s.label}
          icon=${s.icon}
          items=${queue[s.key] || []}
          collapsed=${collapsedSections[s.key]}
          onToggleCollapse=${() => toggleCollapse(s.key)}
          onPrioritize=${onPrioritize}
          onSendToBottom=${onSendToBottom}
          onRemove=${onRemove}
          onRetry=${onRetry}
          onRecover=${onRecover}
          onCardClick=${onCardClick}
        />
        ${s.paginated && queue._completedPages > 1 && html`
          <div class="pagination">
            <button
              class="page-btn"
              disabled=${completedPage === 0}
              onClick=${() => onPageChange(completedPage - 1)}
            >\u2190 Prev</button>
            <span class="page-info">${completedPage + 1} / ${queue._completedPages} <span class="page-total">(${queue._totalCompleted} items, last 7d)</span></span>
            <button
              class="page-btn"
              disabled=${completedPage >= queue._completedPages - 1}
              onClick=${() => onPageChange(completedPage + 1)}
            >Next \u2192</button>
          </div>
        `}
      `)}
    </div>
  `;
}

function ContextAuditView({ audit, loading, error }) {
  const [scoreFilter, setScoreFilter] = useState('all');
  const [dropFilter, setDropFilter] = useState('all');

  if (loading) return html`<div class="audit-empty">Loading versioned audit evidence...</div>`;
  if (error || !audit?.available) {
    return html`
      <div class="audit-empty">
        <strong>Audit reports unavailable</strong>
        Mission Control cannot read a valid canonical report from the configured root. Queue operations are unaffected.
      </div>
    `;
  }

  const repositories = (audit.repositories || []).filter(repository => {
    const scoreMatches =
      scoreFilter === 'all' ||
      (scoreFilter === 'below60' && repository.score < 60) ||
      (scoreFilter === '60to79' && repository.score >= 60 && repository.score < 80) ||
      (scoreFilter === '80plus' && repository.score >= 80);
    const dropMatches =
      dropFilter === 'all' ||
      (dropFilter === 'dropped' && repository.change < 0) ||
      (dropFilter === 'drop10' && repository.change < -10) ||
      (dropFilter === 'improved' && repository.change > 0) ||
      (dropFilter === 'unchanged' && repository.change === 0);
    return scoreMatches && dropMatches;
  });
  const summary = audit.summary || {};
  const delta = audit.delta || {};

  return html`
    <div class="context-audit-view">
      <section class="audit-hero">
        <div>
          <div class="audit-kicker">Repository context / Read-only evidence</div>
          <h1>Repository context coverage</h1>
          <p>Versioned baseline and delta evidence from the control plane. Mission Control displays scores and immutable references; it does not scan, rewrite, or remediate repositories.</p>
        </div>
        <div class="audit-source">
          <div>
            Source observed
            <strong>${audit.observed_at} · ${audit.report_kind.toUpperCase()}</strong>
          </div>
          <div>
            Inventory revision
            <strong>${audit.inventory_revision}</strong>
          </div>
          <a href=${audit.source?.url} target="_blank" rel="noopener noreferrer">Open versioned inventory \u2197</a>
        </div>
      </section>

      <div class="audit-state ${audit.stale ? 'stale' : ''}">
        <span>${audit.stale ? 'REPORT STALE' : 'REPORT CURRENT'} · ${audit.age_days} day${audit.age_days === 1 ? '' : 's'} old</span>

// Toast system
let _setToasts = null;
function showToast(msg, type = '') {
  if (_setToasts) {
    _setToasts(prev => [...prev, { msg, type, id: Date.now() }]);
    setTimeout(() => _setToasts(prev => prev.slice(1)), 3000);
  }
}

function AgentLogViewer({ item }) {
  const [agentStatus, setAgentStatus] = useState(null);
  const [logTail, setLogTail] = useState('');
  const [autoScroll, setAutoScroll] = useState(true);
  const logRef = useRef(null);

  const fetchStatus = useCallback(async () => {
    try {
      const r = await fetch(API + '/api/agent-status?item_id=' + encodeURIComponent(item.id));
      if (!r.ok) return;
      const d = await r.json();
      setAgentStatus(d);
      if (d.log_tail !== null) setLogTail(d.log_tail);
    } catch (e) {}
  }, [item.id]);

  useEffect(() => {
    fetchStatus();
    const interval = setInterval(fetchStatus, 3000);
    return () => clearInterval(interval);
  }, [fetchStatus]);

  useEffect(() => {
    if (autoScroll && logRef.current) {
      logRef.current.scrollTop = logRef.current.scrollHeight;
    }
  }, [logTail, autoScroll]);

  const status = agentStatus?.status || 'loading';
  const isRunning = status === 'running';
  const linkedPRs = agentStatus?.linked_prs || [];

  return html`
    <h3 style="margin:0 0 0.75rem 0">
      ${isRunning ? '\u{1F916} Agent Running' : status === 'exited' ? '\u2705 Agent Finished' : '\u23F3 Loading...'}
      ${agentStatus?.pid && html`<span style="font-weight:normal;font-size:0.75rem;color:var(--text-muted);margin-left:0.5rem">PID ${agentStatus.pid}</span>`}
    </h3>

    <div class="agent-info">
      ${agentStatus?.started_at && html`<span>Started ${timeAgo(agentStatus.started_at)}</span>`}
      ${agentStatus?.prompt && html`<span>Prompt: ${agentStatus.prompt}</span>`}
    </div>

    ${linkedPRs.length > 0 && html`
      <div class="agent-prs">
        ${linkedPRs.map(pr => html`
          <a key=${pr.pr_number} href="https://github.com/${item.repo}/pull/${pr.pr_number}" target="_blank" rel="noopener noreferrer" class="agent-pr-link">
            PR #${pr.pr_number} ${pr.pr_title || ''}
          </a>
        `)}
      </div>
    `}

    <div class="log-controls">
      <label class="log-autoscroll">
        <input type="checkbox" checked=${autoScroll} onChange=${e => setAutoScroll(e.target.checked)} />
        Auto-scroll
      </label>
    </div>

    <div class="agent-log" ref=${logRef}>
      ${logTail
        ? logTail.split('\n').map((line, i) => html`<div key=${i} class="log-line">${line}</div>`)
        : html`<div class="log-line log-dim">Waiting for agent output...</div>`
      }
    </div>
  `;
}

function ItemEventLog({ item }) {
  const [events, setEvents] = useState(null);
  const [error, setError] = useState(null);

  const fetchEvents = useCallback(async () => {
    try {
      const r = await fetch(API + '/api/events?limit=30&item_id=' + encodeURIComponent(item.id));
      if (!r.ok) throw new Error(r.status);
      setEvents(await r.json());
      setError(null);
    } catch (e) {
      setError(e.message || String(e));
    }
  }, [item.id]);

  useEffect(() => {
    fetchEvents();
    const interval = setInterval(fetchEvents, POLL_MS);
    return () => clearInterval(interval);
  }, [fetchEvents]);

  return html`
    <div class="trace-panel">
      <h3>Issue Event Log</h3>
      ${error && html`<div class="trace-empty">Event API unavailable: ${error}</div>`}
      ${!error && !events && html`<div class="trace-empty">Loading issue events...</div>`}
      ${!error && events && events.length === 0 && html`<div class="trace-empty">No events recorded for this item yet.</div>`}
      ${events && events.length > 0 && html`
        <div class="timeline" style="max-width:none">
          ${events.map(e => {
            const icon = EVENT_ICONS[e.event_type] || '●';
            const color = EVENT_COLORS[e.event_type] || '';
            const details = parseDetails(e.details);
            const summary = details.pr_number ? `PR #${details.pr_number}`
              : details.error ? details.error
              : details.error_summary ? details.error_summary
              : details.status ? details.status
              : details.dispatch_id ? details.dispatch_id
              : details.reason ? details.reason
              : '';
            return html`
              <div class="tl-item compact">
                <div class="tl-icon ${color}">${icon}</div>
                <div class="tl-content">
                  <div class="tl-title"><strong>${e.event_type}</strong></div>
                  <div class="tl-detail">
                    ${summary ? String(summary).slice(0, 180) : (e.title || '').slice(0, 120)}
                  </div>
                </div>
                <div class="tl-time">${timeAgo(e.timestamp)}</div>
              </div>
            `;
          })}
        </div>
      `}
    </div>
  `;
}

      const r = await fetch(API + '/api/agent-trace?item_id=' + encodeURIComponent(item.id));

      setTraceData(await r.json());

    } catch (e) {
      setError(e.message || String(e));
    }
  }, [item.id]);

  const trace = traceData?.trace;

      `}
      ${trace && html`
        <div class="trace-grid">
          <div class="trace-kv">
            <div class="trace-kv-label">Status</div>
            <div class="trace-kv-value">${trace.status || 'unknown'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">Session</div>
            <div class="trace-kv-value">${trace.session_id || '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">Dispatch</div>
            <div class="trace-kv-value">${trace.dispatch_id || '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">PID</div>
            <div class="trace-kv-value">${trace.pid || '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">Model</div>
            <div class="trace-kv-value">${[trace.model_provider, trace.model].filter(Boolean).join(' / ') || '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">Prompt</div>
            <div class="trace-kv-value">${trace.prompt_id || '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">PR</div>
            <div class="trace-kv-value">${trace.pr_number ? '#' + trace.pr_number : '-'}</div>
          </div>
          <div class="trace-kv">
            <div class="trace-kv-label">Updated</div>
            <div class="trace-kv-value">${trace.updated_at ? timeAgo(trace.updated_at) : '-'}</div>
          </div>
        </div>

        ${trace.error_summary && html`
          <div class="trace-empty" style="margin-bottom:0.75rem;color:var(--color-fail)">
            ${trace.error_summary}
          </div>
        `}
      `}

      ${bundle && html`
        <div class="trace-files">
          ${Object.entries(files).map(([name, info]) => html`
            <div class="trace-file ${info.exists ? 'exists' : ''}" title=${info.path}>
              <span>${name}</span>
              <span class="trace-file-size">${info.exists ? formatBytes(info.bytes) : 'missing'}</span>
            </div>
          `)}
        </div>
      `}

      ${diagnosticTail && html`
        <div class="agent-log" style="max-height:220px">
          ${diagnosticTail.split('\n').map((line, i) => html`<div key=${i} class="log-line">${line}</div>`)}
        </div>
      `}
    </div>

function WorkerTraceCard({ worker, item, enriched, onInspect }) {
  const statusData = enriched?.statusData || null;
  const traceData = enriched?.traceData || null;
  const trace = traceData?.trace || {};
  const errors = enriched?.errors || [];
  const reliability = traceReliability(worker, statusData, traceData, errors);
  const missing = missingTelemetryFor(worker, statusData, trace);
  const telemetry = worker?.telemetry || {};
  const issueNumber = item?.issue_number || worker?.issue_number || trace?.issue_number;
  const repo = item?.repo || worker?.repo || trace?.repo || 'unknown repo';
  const status = statusData?.status || worker?.last_status || worker?.state || trace?.status || 'unknown';
  const pid = worker?.pid || worker?.item_pid || statusData?.pid || trace?.pid;
  const sessionId = worker?.session_id || statusData?.session_id || trace?.session_id;
  const dispatchId = worker?.dispatch_id || statusData?.dispatch_id || trace?.dispatch_id;
  const model = [trace?.model_provider || telemetry?.model_provider || telemetry?.provider, trace?.model || telemetry?.model].filter(Boolean).join(' / ') || '-';
  const prompt = trace?.prompt_id || statusData?.prompt || telemetry?.prompt_id || item?.agent_prompt || '-';

  return html`
    <div class="agent-card ${reliability.level}">
      <div class="agent-card-header">
        <div>
          <div class="agent-card-title">${worker?.item_id || item?.id || 'Unknown worker'}</div>
          <div class="agent-card-meta">
            ${repo}${issueNumber ? '#' + issueNumber : ''} · ${status}
          </div>
        </div>
        <div class="agents-summary">
          <span class="telemetry-badge ${reliability.level}" title=${reliability.reason}>${reliability.label}</span>
          <button class="agent-inspect-btn" onClick=${() => item && onInspect(item)}>Inspect issue</button>
        </div>
      </div>

      <div class="agent-kv-grid">
        <div class="agent-kv"><div class="agent-kv-label">State</div><div class="agent-kv-value">${worker?.state || '-'}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Status</div><div class="agent-kv-value">${status}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Started</div><div class="agent-kv-value">${displayTime(worker?.started_at || statusData?.started_at || trace?.started_at)}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Claimed</div><div class="agent-kv-value">${displayTime(worker?.claimed_at)}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Heartbeat</div><div class="agent-kv-value">${displayTime(worker?.last_heartbeat_at)}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Lease</div><div class="agent-kv-value">${displayTime(worker?.lease_expires_at)}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">PID</div><div class="agent-kv-value">${pid || html`<span class="telemetry-badge amber">missing</span>`}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Session</div><div class="agent-kv-value">${sessionId || html`<span class="telemetry-badge amber">missing</span>`}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Dispatch</div><div class="agent-kv-value">${dispatchId || html`<span class="telemetry-badge amber">missing</span>`}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Model</div><div class="agent-kv-value">${model}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Prompt</div><div class="agent-kv-value">${prompt}</div></div>
        <div class="agent-kv"><div class="agent-kv-label">Liveness</div><div class="agent-kv-value">${statusData?.liveness_reliable || worker?.liveness_reliable ? 'reliable' : 'unreliable'}</div></div>
      </div>

      ${missing.length > 0 && html`
        <div class="agents-summary" style="justify-content:flex-start;margin-bottom:0.75rem">
          ${missing.map(m => html`<span class="telemetry-badge amber">missing ${m}</span>`)}
        </div>
      `}
      ${errors.length > 0 && html`
        <div class="trace-empty" style="color:var(--color-fail);margin-bottom:0.75rem">${errors.join(' · ')}</div>
      `}

      <div class="agent-section-title">Trace Bundle</div>
      <${BundleFiles} bundle=${traceData?.bundle} />
      ${traceData && !traceData.has_trace && html`<div class="trace-empty">No trace row exists for this worker yet. This is expected for older or telemetry-poor dispatches.</div>`}
      ${traceData && !traceData.has_bundle && html`<div class="trace-empty">No trace bundle directory exists at ${compactPath(traceData.bundle?.trace_dir)}.</div>`}
      <${LogTailPanel} statusData=${statusData} traceData=${traceData} />
    </div>
  `;
}

function RecentDispatchEvents({ events }) {
  const rows = events || [];
  return html`
    <div class="dispatch-list">
      <h3>Recent Dispatch Events</h3>
      ${rows.length === 0 ? html`<div class="empty-section">No recent dispatch events</div>` : rows.map(e => {
        const details = parseDetails(e.details);
        const missing = ['dispatch_id', 'session_id', 'pid'].filter(k => !details[k]);
        return html`
          <div class="dispatch-event">
            <div>
              <div class="dispatch-event-title">${e.item_id || details.item_id || 'unknown item'}</div>
              <div class="dispatch-event-meta">
                ${(e.repo || details.repo || 'unknown repo')}${(e.issue_number || details.issue_number) ? '#' + (e.issue_number || details.issue_number) : ''}
                · prompt ${details.prompt || details.prompt_id || '-'}
                · ${[details.model_provider, details.model].filter(Boolean).join(' / ') || 'model unknown'}
              </div>
              <div class="agents-summary" style="justify-content:flex-start;margin-top:0.35rem">
                ${missing.length ? missing.map(k => html`<span class="telemetry-badge amber">missing ${k}</span>`) : html`<span class="telemetry-badge green">telemetry present</span>`}
              </div>
            </div>
            <div class="dispatch-event-time">${timeAgo(e.timestamp || e.created_at)}</div>
          </div>
        `;
      })}

  `;
}

function LiveAgentsView({ health, queue, dispatchEvents, onInspect }) {
  const [enriched, setEnriched] = useState({});
  const [loading, setLoading] = useState(false);
  const workers = (health?.worker_pools?.workers || []).filter(w => (w.state || 'active') === 'active');
  const byItem = queueIndex(queue);

  const loadWorkerDetails = useCallback(async () => {
    if (workers.length === 0) {
      setEnriched({});
      return;
    }
    setLoading(true);
    const pairs = await Promise.allSettled(workers.map(async worker => {
      const itemId = worker.item_id;
      if (!itemId) return [worker.id || Math.random(), { statusData: null, traceData: null, errors: ['worker has no item_id'] }];
      const [statusResult, traceResult] = await Promise.allSettled([
        apiJson('/api/agent-status?item_id=' + encodeURIComponent(itemId)),
        apiJson('/api/agent-trace?item_id=' + encodeURIComponent(itemId)),
      ]);
      const errors = [];
      if (statusResult.status === 'rejected') errors.push('status: ' + statusResult.reason.message);
      if (traceResult.status === 'rejected') errors.push('trace: ' + traceResult.reason.message);
      return [itemId, {
        statusData: statusResult.status === 'fulfilled' ? statusResult.value : null,
        traceData: traceResult.status === 'fulfilled' ? traceResult.value : null,
        errors,
      }];
    }));
    const next = {};
    pairs.forEach(result => {
      if (result.status === 'fulfilled') next[result.value[0]] = result.value[1];
    });
    setEnriched(next);
    setLoading(false);
  }, [JSON.stringify(workers.map(w => [w.id, w.item_id, w.pid, w.session_id, w.dispatch_id, w.last_heartbeat_at]))]);

  useEffect(() => {
    loadWorkerDetails();
    const i = setInterval(loadWorkerDetails, POLL_MS);
    return () => clearInterval(i);
  }, [loadWorkerDetails]);

  const reliabilityCounts = workers.reduce((acc, worker) => {
    const detail = enriched[worker.item_id] || {};
    const r = traceReliability(worker, detail.statusData, detail.traceData, detail.errors || []);
    acc[r.level] = (acc[r.level] || 0) + 1;
    return acc;
  }, {});

  return html`
    <div class="agents-view">
      <div class="agents-hero">
        <div>
          <div class="agents-title">Agent Traces / Live Agents</div>
          <div class="agents-subtitle">
            Polling active worker pools, agent status, trace bundles, and dispatch events every ${Math.round(POLL_MS / 1000)} seconds.
          </div>
        </div>
        <div class="agents-summary">
          <span class="agent-pill">${workers.length} active</span>
          <span class="agent-pill green">${reliabilityCounts.green || 0} reliable</span>
          <span class="agent-pill amber">${reliabilityCounts.amber || 0} partial</span>
          <span class="agent-pill red">${reliabilityCounts.red || 0} errors</span>
          ${loading && html`<span class="agent-pill">refreshing</span>`}
        </div>
      </div>

      ${workers.length === 0 ? html`
        <div class="empty-section">No active workers are registered in worker_pools.</div>
      ` : workers.map(worker => html`
        <${WorkerTraceCard}
          key=${worker.item_id || worker.id}
          worker=${worker}
          item=${byItem[worker.item_id]}
          enriched=${enriched[worker.item_id]}
          onInspect=${onInspect}
        />
      `)}

      <${RecentDispatchEvents} events=${dispatchEvents} />
    </div>
  `;
}

function App() {
  const [tab, setTab] = useState('portfolio');
  const [repoFilter, setRepoFilter] = useState('all');
  const [statusFilter, setStatusFilter] = useState('active'); // active, completed, failed, all
  const [completedPage, setCompletedPage] = useState(0);
  const PAGE_SIZE = 20;
  const [syncing, setSyncing] = useState(false);
  const [toasts, setToasts] = useState([]);
  const [animatingCards, setAnimatingCards] = useState({});
  const [selectedItem, setSelectedItem] = useState(null);
  const [issueDetail, setIssueDetail] = useState(null);
  const [issueLoading, setIssueLoading] = useState(false);
  const [dispatching, setDispatching] = useState(false);
  _setToasts = setToasts;

  const queue = useFetch('/api/queue');
  const portfolio = useFetch('/api/portfolio');
  const outcomes = useFetch('/api/outcome-funnel');
  const contextAudit = useFetch('/api/context-audit');

  // Deep linking: open issue from URL hash (#issue=repo/owner#123)
  useEffect(() => {
    function handleHash() {
      const hash = window.location.hash.slice(1);
      const params = new URLSearchParams(hash);
      const issueId = params.get('issue');
      if (issueId && !selectedItem) {
        // Find item in queue data
        const q = queue.data;
        if (!q) return;
        const all = [...(q.pending||[]), ...(q.in_progress||[]), ...(q.completed||[]), ...(q.failed||[])];
        const item = all.find(i => i.id === issueId);
        if (item) openIssueDetail(item);
      }
    }
    // Check on load and on hash change
    if (queue.data) handleHash();
    window.addEventListener('hashchange', handleHash);
    return () => window.removeEventListener('hashchange', handleHash);
  }, [queue.data]);
  const events = useFetch('/api/events?limit=50');
  const dispatchEvents = useFetch('/api/events?type=issue.dispatched&limit=10');
  const health = useFetch('/api/health');
  const stats = useFetch('/api/stats');
  const tree = useFetch('/api/decompose-tree');
  const repos = useFetch('/api/repos');
  const prompts = useFetch('/api/prompts');
  const diagnostics = useFetch('/api/eligibility');

  const filteredQueue = (() => {
    if (!queue.data) return null;
    const base = repoFilter === 'all' ? queue.data : {
      pending: (queue.data?.pending || []).filter(i => i.repo === repoFilter),
      in_progress: (queue.data?.in_progress || []).filter(i => i.repo === repoFilter),
      completed: (queue.data?.completed || []).filter(i => i.repo === repoFilter),
      failed: (queue.data?.failed || []).filter(i => i.repo === repoFilter),
    };
    // Filter completed to last 7 days
    const sevenDaysAgo = Date.now() - 7 * 24 * 60 * 60 * 1000;
    const recentCompleted = (base.completed || []).filter(i => {
      const ts = i.completed_at || i.started_at || i.enqueued_at;
      return ts && new Date(ts).getTime() > sevenDaysAgo;
    });
    // Paginate completed
    const totalCompleted = recentCompleted.length;
    const paginatedCompleted = recentCompleted.slice(completedPage * PAGE_SIZE, (completedPage + 1) * PAGE_SIZE);
    return {
      ...base,
      completed: paginatedCompleted,
      _totalCompleted: totalCompleted,
      _completedPage: completedPage,
      _completedPages: Math.ceil(totalCompleted / PAGE_SIZE),
    };
  })();

  const counts = {
    portfolio: portfolio.data?.projects?.length || 0,
    outcomes: outcomes.data?.funnel?.accepted?.count || 0,
    'context-audit': contextAudit.data?.summary?.threshold_findings || 0,
    kanban: (filteredQueue?.pending?.length || 0) + (filteredQueue?.in_progress?.length || 0) + (filteredQueue?.failed?.length || 0),
    agents: health.data?.worker_pools?.active_workers || 0,
    activity: events.data?.length || 0,
    guards: stats.data?.guard_triggers?.length || 0,
    tree: tree.data?.length || 0,
  };

  async function syncGitHub() {
    setSyncing(true);
    try {
      const params = repoFilter !== 'all' ? `?repo=${encodeURIComponent(repoFilter)}` : '';
      const r = await fetch(API + '/api/sync' + params);
      const d = await r.json();
      const t = d.totals || {};
      const parts = [];
      if (t.added) parts.push(`${t.added} added`);
      if (t.closed) parts.push(`${t.closed} closed`);
      if (t.unchanged) parts.push(`${t.unchanged} unchanged`);
      // Check for per-repo errors
      const errors = Object.entries(d.repos || {})
        .filter(([, v]) => v.errors?.length > 0)
        .map(([repo, v]) => `${repo.split('/')[1]}: ${v.errors[0]}`);
      const summary = parts.length > 0 ? parts.join(', ') : 'No changes';
      showToast(errors.length > 0
        ? `${summary} (${errors.length} error${errors.length > 1 ? 's' : ''})`
        : summary, errors.length > 0 ? 'warning' : 'success');
      queue.refresh();
      diagnostics.refresh();
    } catch (e) {
      showToast('Sync failed: ' + e.message, 'error');
    } finally {
      setSyncing(false);
    }
  }

  function animateCard(id, animClass) {
    setAnimatingCards(prev => ({ ...prev, [id]: animClass }));
    setTimeout(() => setAnimatingCards(prev => {
      const next = { ...prev };
      delete next[id];
      return next;
    }), 600);
  }

  async function prioritizeTop(itemId) {
    animateCard(itemId, 'card-prioritized');
    try {
      await fetch(API + '/api/queue/prioritize/' + encodeURIComponent(itemId), { method: 'PATCH' });
      showToast('Moved to top \u2191', 'success');
      queue.refresh();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  async function sendToBottom(itemId) {
    animateCard(itemId, 'card-sinking');
    // Small delay so user sees the animation before the card moves
    setTimeout(async () => {
      try {
        await fetch(API + '/api/queue/move-to-bottom/' + encodeURIComponent(itemId), { method: 'PATCH' });
        showToast('Sent to bottom \u2193', 'success');
        queue.refresh();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }, 350);
  }

  async function removeItem(itemId) {
    if (!window.confirm(`Permanently remove ${itemId} from Mission Control? This does not preserve or requeue active work.`)) {
      return;
    }
    animateCard(itemId, 'card-removed');
    setTimeout(async () => {
      try {
        const response = await fetch(API + '/api/queue/remove/' + encodeURIComponent(itemId), { method: 'PATCH' });
        const result = await response.json();
        if (!response.ok || !result.ok) {
          throw new Error(result.reason || result.error || 'Removal was refused');
        }
        showToast('Removed from queue', 'success');
        queue.refresh();
      } catch (e) {
        showToast('Failed: ' + e.message, 'error');
      }
    }, 350);
  }

  async function recoverItem(itemId) {
    const endpoint = API + '/api/queue/remove/' + encodeURIComponent(itemId);
    try {
      const previewResponse = await fetch(endpoint, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requeue: true, dry_run: true }),
      });
      const preview = await previewResponse.json();
      if (!previewResponse.ok || !preview.ok) {
        throw new Error(preview.reason || 'Worker recovery was refused');
      }
      if (!window.confirm(`Requeue ${itemId}? Branch, worktree, logs, phase, and recovery instructions will be preserved.`)) {
        return;
      }
      const response = await fetch(endpoint, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ requeue: true }),
      });
      const result = await response.json();
      if (!response.ok || !result.ok) {
        throw new Error(result.reason || 'Worker recovery was refused');
      }
      showToast('Worker recovered and issue requeued', 'success');
      queue.refresh();
    } catch (e) {
      showToast('Recovery refused: ' + e.message, 'error');
    }
  }

  async function retryItem(itemId) {
    try {
      await fetch(API + '/api/queue/retry/' + encodeURIComponent(itemId), { method: 'PATCH' });
      showToast('Retrying...', 'success');
      queue.refresh();
    } catch (e) {
      showToast('Failed: ' + e.message, 'error');
    }
  }

  function closeModal() {
    setSelectedItem(null);
    setIssueDetail(null);
    window.location.hash = '';
  }

  async function openIssueDetail(item) {
    setSelectedItem(item);
    setIssueDetail(null);
    setIssueLoading(true);
    // Set URL hash for deep linking
    window.location.hash = `issue=${encodeURIComponent(item.id)}`;
    try {
      const r = await fetch(API + '/api/issue?repo=' + encodeURIComponent(item.repo) + '&number=' + item.issue_number);
      if (!r.ok) throw new Error(r.status);
      setIssueDetail(await r.json());
    } catch (e) {
      setIssueDetail({ error: e.message });
    } finally {
      setIssueLoading(false);
    }
  }

  async function dispatchAgent(itemId, promptId) {
    setDispatching(true);
    try {
      const r = await fetch(API + '/api/dispatch', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: itemId, prompt_id: promptId }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      showToast(`Agent dispatched! PID ${d.pid}`, 'success');
      closeModal();
      queue.refresh();
    } catch (e) {
      showToast('Dispatch failed: ' + e.message, 'error');
    } finally {
      setDispatching(false);
    }
  }

  async function finishAgent(itemId) {
    setDispatching(true);
    try {
      const r = await fetch(API + '/api/finish', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ item_id: itemId }),
      });
      const d = await r.json();
      if (!r.ok) throw new Error(d.error || r.status);
      const summary = (d.actions || []).join(' \u2192 ');
      if (d.pr_url) {
        showToast(`Finished! ${summary}`, 'success');
      } else {
        showToast(d.message || d.action || 'Nothing to do', 'info');
      }
      queue.refresh();
    } catch (e) {
      showToast('Finish failed: ' + e.message, 'error');
    } finally {
      setDispatching(false);
    }
  }

  return html`
    <${Header} queue=${queue.data} />
    <${TabBar} active=${tab} onSwitch=${setTab} counts=${counts} />
    <div class="content">
      ${tab !== 'portfolio' && tab !== 'outcomes' && tab !== 'context-audit' && html`<${StatsBar} queue=${queue.data} stats=${stats.data} />`}
      ${tab !== 'portfolio' && tab !== 'outcomes' && tab !== 'context-audit' && html`<${RepoEligibilityAlerts} diagnostics=${diagnostics.data} repoFilter=${repoFilter} />`}
      ${tab === 'portfolio' && html`
        <${PortfolioView} portfolio=${portfolio.data} loading=${portfolio.loading} error=${portfolio.error} />
      `}
      ${tab === 'outcomes' && html`
        <${OutcomeFunnelView} outcomes=${outcomes.data} loading=${outcomes.loading} error=${outcomes.error} />
      `}
      ${tab === 'context-audit' && html`
        <${ContextAuditView} audit=${contextAudit.data} loading=${contextAudit.loading} error=${contextAudit.error} />
      `}
      ${tab === 'kanban' && html`
        <div class="filter-bar">
          <div class="status-tabs">
            ${[
              { key: 'active', label: 'Active' },
              { key: 'completed', label: 'Completed' },
              { key: 'failed', label: 'Failed' },
              { key: 'all', label: 'All' },
            ].map(st => html`
              <button key=${st.key}
                class="status-tab ${statusFilter === st.key ? 'active' : ''}"
                onClick=${() => { setStatusFilter(st.key); setCompletedPage(0); }}
              >${st.label}</button>
            `)}
          </div>
          <div class="filter-right">
            <select class="filter-select" value=${repoFilter} onChange=${e => setRepoFilter(e.target.value)}>
              <option value="all">All Repos</option>
              ${(repos.data || []).map(r => html`<option value=${r}>${r.split('/')[1]}</option>`)}
            </select>
            <button class="sync-btn ${syncing ? 'syncing' : ''}" onClick=${syncGitHub} disabled=${syncing}>
              ${syncing ? '\u21BB Syncing...' : '\u21BB Sync GitHub'}
            </button>
          </div>
        </div>
        <${VerticalKanban}
          queue=${filteredQueue}
          statusFilter=${statusFilter}
          completedPage=${completedPage}
          onPageChange=${setCompletedPage}
          onPrioritize=${prioritizeTop}
          onSendToBottom=${sendToBottom}
          onRemove=${removeItem}
          onRetry=${retryItem}
          onRecover=${recoverItem}
          onCardClick=${openIssueDetail}
        />
      `}
      ${tab === 'agents' && html`
        <${LiveAgentsView}
          health=${health.data}
          queue=${queue.data}
          dispatchEvents=${dispatchEvents.data}
          onInspect=${openIssueDetail}
        />
      `}
      ${tab === 'activity' && html`<${ActivityView} events=${events.data} />`}
      ${tab === 'metrics' && html`<${MetricsView} stats=${stats.data} />`}
      ${tab === 'guards' && html`<${GuardsView} stats=${stats.data} />`}
      ${tab === 'tree' && html`<${TreeView} data=${tree.data} />`}
    </div>
    ${selectedItem && html`
      <${IssueDetailModal}
        item=${selectedItem}
        issue=${issueDetail}
        prompts=${prompts.data}
        onClose=${closeModal}
        onDispatch=${dispatchAgent}
        onFinish=${finishAgent}
        dispatching=${dispatching}
      />
    `}
    <div class="toast-container">
      ${toasts.map(t => html`<div key=${t.id} class="toast ${t.type}">${t.msg}</div>`)}
    </div>
  `;
}

render(html`<${App} />`, document.getElementById('app'));
</script>
</body>
</html>
